<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNDIRECT CXM · UI prototype</title>
<!--
  ============================================================================
  VNDIRECT CXM & VoC PLATFORM — UI PROTOTYPE
  ============================================================================
  File này là prototype giao diện, KHÔNG có backend. Mọi số liệu là demo data.
  Mở trực tiếp bằng browser, không cần cài gì.

  CÁCH SỬA NỘI DUNG (không cần biết code):
    Mở file bằng VS Code / Notepad++ / bất kỳ text editor, sửa chữ trong dấu
    nháy, lưu lại rồi refresh browser. Nội dung nằm ở ĐÚNG BỐN CHỖ:

    1. Object DATA  (tìm dòng  ===== 1. DATA =====)
       Số liệu, câu nói của khách, tên bước, taxonomy, nhãn menu (DATA.nav),
       tiêu đề màn (DATA.meta), lời dẫn guided tour (DATA.tour), và câu hỏi
       đáp của màn Trợ lý (DATA.chips).

    1b. Object CFG_DEFAULT  (tìm dòng  ===== 2a. CFG =====)
       NGƯỠNG ĐÁNH GIÁ: thế nào là "cần theo dõi", thế nào là "cần xử lý ngay".
       Không cần sửa file để thử — mở màn "Chỉ số & ngưỡng" (menu Quản trị) là
       sửa được ngay trong browser, đổi một ô là cả app tô lại. Sửa trong file
       chỉ để đổi giá trị MẶC ĐỊNH khi mở lần đầu.

    2. Câu kết luận lớn ở đầu mỗi màn  (tìm  ===== 3. VIEWS =====)
       Các câu cỡ lớn kiểu "Cứ 6 người vào bước nhận diện khuôn mặt thì 1
       người không qua được" nằm TRONG hàm của từng màn, không nằm trong DATA.
       Tìm chuỗi  t-hero  để thấy hết. Vài câu có chèn số tự tính, ví dụ
       ${measured} — giữ nguyên phần ${...}, chỉ sửa chữ xung quanh.

    3. Màu thương hiệu  (tìm  DESIGN TOKENS  trong phần <style>)
       Sửa --primary là toàn app đổi theo. Không hardcode màu ở chỗ nào khác.

  LƯỚI AN TOÀN: mỗi lần refresh, validateFixture() tự kiểm mọi liên kết dữ
  liệu. Nếu bạn sửa làm đứt liên kết nào, một banner đỏ sẽ hiện trên mọi màn
  và nói chính xác chỗ sai. Banner biến mất khi dữ liệu đúng lại.

  Spec đầy đủ: docs/superpowers/specs/2026-07-27-cxm-voc-redesign-design.md
  ============================================================================
-->
<style>
/* ===================== DESIGN TOKENS =====================
   Đổi màu thương hiệu ở đây. Mọi màu trong app đi qua các biến này. */
:root{
  /* Cam VNDIRECT — chỉ dùng cho TƯƠNG TÁC và ĐỊNH DANH.
     Không bao giờ dùng cam làm màu trạng thái. */
  --primary:#D9531E;
  --primary-hover:#B84415;
  --primary-soft:#FDF3EE;
  --primary-line:#F3D5C4;
  --primary-ring:rgba(217,83,30,.22);

  /* Xám ấm — chiếm ~90% giao diện */
  --bg:#FAF9F7;
  --surface:#FFFFFF;
  --surface2:#F4F2EF;
  --line:#E5E1DB;
  --line-soft:#F0EDE8;
  --ink-dark:#292420;
  --ink:#1C1917;
  --ink2:#57534E;
  --ink3:#8C8681;

  /* 4 trạng thái. "Đang kiểm soát" KHÔNG có màu riêng — đó là chủ ý. */
  --watch:#A16207;  --watch-bg:#FDFBEB;  --watch-line:#EADDA0;
  --crit:#B3261E;   --crit-bg:#FDF1F0;   --crit-line:#F3C9C4;
  --unk:#8C8681;
  --good:#3F6212;   --good-bg:#F8FAF1;   --good-line:#DDE8C4;

  --radius:12px;
  --shadow:0 1px 2px rgba(28,25,23,.04), 0 8px 24px rgba(28,25,23,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-width:1280px;
  font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:38px 38px;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font:inherit;color:inherit}
button,select{cursor:pointer}
a{color:var(--primary);text-decoration:none}

/* ===================== THANG CHỮ — 7 bậc, sàn 12px ===================== */
.t-lbl{font:700 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3)}
.t-meta{font-size:13px;color:var(--ink2)}
.t-body{font-size:14px}
.t-item{font-size:15px;font-weight:600}
.t-block{font-size:18px;font-weight:650;letter-spacing:-.005em}
.t-num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t-hero{font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.16;margin:0}
.dim{color:var(--ink3)} .dim2{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}

/* ===================== SHELL ===================== */
.app{display:flex;height:100vh;overflow:hidden}
aside.side{width:246px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:17px 18px;border-bottom:1px solid var(--line)}
.brand .mark{width:34px;height:34px;flex:none;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.brand .nm{font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font:700 12px/1.2 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.11em;color:var(--ink3);margin-top:2px}
nav.nav{flex:1;overflow-y:auto;padding:6px 0 14px}
nav.nav .g{padding:14px 18px 6px;font:700 12px/1.2 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3)}
nav.nav a.it{display:flex;align-items:center;gap:9px;margin:1px 8px;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--ink2)}
nav.nav a.it:hover{background:var(--surface2);color:var(--ink)}
nav.nav a.it.on{background:var(--primary);color:#fff;font-weight:600}
nav.nav a.it .ic{width:16px;flex:none;text-align:center;font-size:13px;opacity:.85}
nav.nav a.it .bdg{margin-left:auto;font:700 12px/1 ui-monospace,Menlo,monospace;background:var(--crit);color:#fff;padding:3px 5px;border-radius:5px}
nav.nav a.it.on .bdg{background:rgba(255,255,255,.25)}
.sidefoot{border-top:1px solid var(--line);padding:12px 18px;font-size:12px;color:var(--ink3)}

.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{flex:none;display:flex;align-items:center;gap:14px;height:56px;padding:0 22px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .ttl{min-width:0}
header.top .ttl b{font-size:13.5px;display:block}
header.top .ttl span{font-size:12px;color:var(--ink3)}
.grow{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--watch-line);background:var(--watch-bg);color:var(--watch)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--watch)}
.filters{display:flex;align-items:center;gap:8px;padding:4px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.filters label{font:700 12px/1 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3)}
.filters select{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 7px;font-size:12.5px;font-weight:600;outline:none}
.filters select:focus{box-shadow:0 0 0 3px var(--primary-ring);border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-ring)}
.btn.sm{padding:5px 9px;font-size:12px}
main.view{flex:1;min-height:0;overflow-y:auto;padding:24px 26px 60px}
.wrap{max-width:1500px}

/* ===================== KHUÔN 4 TẦNG ===================== */
.hero{background:var(--ink-dark);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:16px}
.hero .kick{font:700 12px/1.2 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.13em;color:#F2A883;margin-bottom:12px}
.hero .t-hero{max-width:30ch}
.hero p{margin:12px 0 0;color:#CFC9C2;font-size:14px;max-width:78ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;position:relative}
.stat .t-lbl{margin-bottom:7px}
.stat .src{margin-top:7px;font-size:12px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:7px}
.stat .foot{font-size:12px;color:var(--ink2);margin-top:3px}

/* ===================== CARD ===================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.chead{display:flex;align-items:flex-start;gap:14px;padding:15px 17px;border-bottom:1px solid var(--line)}
.chead .ct{min-width:0}
.chead .ct b{font-size:15px;font-weight:650;display:block}
.chead .ct span{font-size:12.5px;color:var(--ink3)}
/* QUY TẮC DENOMINATOR: mọi card/chart phải hiện "X of Y đơn vị" + kỳ ngày tuyệt đối */
.denom{margin-left:auto;flex:none;text-align:right;font:600 12px/1.5 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);white-space:nowrap}
.cbody{padding:16px 17px}
.cbody.tight{padding:10px 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.split{display:grid;gap:16px}

/* ===================== 4 TRẠNG THÁI — hình trước, màu sau ===================== */
/* Badge trạng thái không bao giờ được wrap — nhãn bị ngắt dòng làm mất nghĩa */
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap}
.st.ok{}
.st.watch{background:var(--watch-bg);border-color:var(--watch-line);color:var(--watch)}
.st.crit{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit)}
.st.unknown{background:transparent;border-style:dashed;border-color:#A8A29E;color:var(--ink3)}
.row-st{border-left:3px solid transparent}
.row-st.watch{border-left-color:var(--watch);background:var(--watch-bg)}
.row-st.crit{border-left-color:var(--crit);background:var(--crit-bg)}
.row-st.unknown{border-left-style:dashed;border-left-color:#A8A29E}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
.chip.b{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary-hover)}
.tri{font-size:12px;font-weight:700}
.tri.up{color:var(--crit)} .tri.dn{color:var(--good)}

/* ===================== LIST / TABLE ===================== */
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);
  font:700 12px/1.3 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:13.5px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--primary-soft)}
tr.sel td{background:var(--primary-soft)}
.lst>*{border-bottom:1px solid var(--line-soft)}
.lst>*:last-child{border-bottom:none}
.itm{display:block;width:100%;text-align:left;padding:13px 15px;background:none;border:none;font:inherit;color:inherit}
.itm:hover{background:var(--surface2)}
.itm.on{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}

/* ===================== CHART thuần SVG/CSS ===================== */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr 56px 44%;gap:11px;align-items:center}
.bar .bn{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px}
.bar .bn i{width:8px;height:8px;border-radius:50%;flex:none}
.bar .bn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.bar .bt{height:10px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar .bt>i{display:block;height:100%;border-radius:3px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px}
.spark>i{flex:1;border-radius:2px 2px 0 0;min-height:3px}
.funnel{display:flex;gap:2px;align-items:stretch}
.fstep{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 12px;position:relative}
.fstep.watch{background:var(--watch-bg);border-color:var(--watch-line)}
.fstep.crit{background:var(--crit-bg);border-color:var(--crit-line)}
.fstep.unknown{border-style:dashed}
.fstep .fc{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink3);letter-spacing:.08em}
.fstep .fn{font-size:12.5px;font-weight:650;margin:6px 0 9px;min-height:32px;line-height:1.3}
.fstep .fv{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.fstep .fl{font-size:12px;color:var(--ink2);margin-top:2px}
.fstep .fbar{margin-top:9px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.fstep .fbar>i{display:block;height:100%}
.drop{position:absolute;top:50%;right:-13px;z-index:2;background:#fff;border:1px solid var(--crit-line);color:var(--crit);
  font:700 12px/1 ui-monospace,Menlo,monospace;padding:3px 4px;border-radius:5px;transform:translateY(-50%)}

/* ===================== WIDGET VoC =====================
   Tiêu đề section là câu hỏi nên nó phải đọc ra như câu hỏi: to hơn tiêu đề card,
   nhỏ hơn hero, có gạch chân mảnh để tách khối. */
.qh { font-size:19px; font-weight:600; letter-spacing:-.01em; margin:0 0 5px;
      padding-bottom:7px; border-bottom:1px solid var(--line); }

/* Khối trên set dashboard. Mặc định hai cột; khối `wide` chiếm cả hàng vì bên
   trong nó đã là một lưới con (bốn khối intent, bốn bảng Top, bốn làn). */
.blks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:start; }
.blk { position:relative; min-width:0; }
.blk.wide { grid-column:1/-1; }
.blkx { position:absolute; top:-7px; right:-7px; z-index:2; width:24px; height:24px; border-radius:50%;
        border:1px solid var(--crit); background:#fff; color:var(--crit); font-size:15px; line-height:1;
        cursor:pointer; display:grid; place-content:center; box-shadow:0 1px 4px rgba(0,0,0,.12); }
.blkx:hover { background:var(--crit); color:#fff; }
@media (max-width:1180px) { .blks { grid-template-columns:minmax(0,1fr); } }
.axis { font-size:11.5px; color:var(--ink3); margin-top:9px; letter-spacing:.01em; }
.bar.clickable { cursor:pointer; border-radius:6px; margin:0 -6px; padding:0 6px; }
.bar.clickable:hover { background:var(--surface2); }
.bar.clickable:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
.bkids { grid-column:1/-1; display:flex; gap:5px; flex-wrap:wrap; margin:5px 0 2px; padding-left:15px; }
.bkids .chip { font-size:11px; padding:2px 7px; }

.donutwrap { display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.donut { width:150px; height:150px; border-radius:50%; flex:none; position:relative; }
.donut::after { content:''; position:absolute; inset:30px; background:var(--surface); border-radius:50%; }
.dcenter { position:absolute; inset:0; display:grid; place-content:center; text-align:center; z-index:1; }
.dcenter b { display:block; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
.dcenter span { display:block; font-size:10.5px; color:var(--ink3); max-width:72px; line-height:1.3; }
.dlegend { display:grid; gap:6px; min-width:200px; flex:1; }
.dlegend > div { display:flex; align-items:center; gap:8px; font-size:12.5px; }
.dlegend i { width:9px; height:9px; border-radius:2px; flex:none; }
.dlegend span { flex:1; color:var(--ink2); }
.dlegend b { font-variant-numeric:tabular-nums; }
.lgd { display:flex; gap:16px; flex-wrap:wrap; margin-top:7px; font-size:12px; color:var(--ink3); }
.lgd i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }

/* Ma trận nguồn × nền tảng. Ô là KÝ HIỆU trước, màu sau — đọc được cả khi in đen trắng. */
.srcmx { width:100%; border-collapse:collapse; font-size:12.5px; }
.srcmx th { text-align:center; font-weight:500; color:var(--ink3); font-size:11px;
            text-transform:uppercase; letter-spacing:.04em; padding:0 0 7px; }
.srcmx th:first-child, .srcmx td:first-child { text-align:left; }
.srcmx td { padding:6px 4px; border-top:1px solid var(--line); text-align:center; }
.srcmx .mk { font-size:14px; line-height:1; }
.srcmx .mk.ok { color:var(--good); } .srcmx .mk.stale { color:var(--watch); }
.srcmx .mk.down { color:var(--crit); } .srcmx .mk.na { color:#C6CDD2; }

/* ===================== BẢN ĐỒ HÀNH TRÌNH =====================
   Rail 7 phase nằm ngang thay cho catalog dọc — không phải kéo xuống
   mới thấy hết flow. Xem thêm khối .spine bên dưới. */
.prail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-bottom:13px}
.prail button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.prail button:hover{border-color:var(--primary-line);background:var(--primary-soft)}
.prail button.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary-ring)}
.prail .pc{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink3);letter-spacing:.08em}
.prail .pn{font-size:12.5px;font-weight:650;margin:6px 0 8px;line-height:1.28;min-height:33px}
.prail .pd{display:flex;gap:3px;align-items:center}
.prail .pd i{width:7px;height:7px;border-radius:50%;flex:none}
.prail .pd span{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600}

.frail{display:flex;gap:20px;flex-wrap:wrap}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600}
.fchips button:hover{background:var(--surface2)}
.fchips button.on{border-color:var(--primary);background:var(--primary);color:#fff}
.fchips button i{width:7px;height:7px;border-radius:50%;flex:none}
.fchips button.on i{box-shadow:0 0 0 2px rgba(255,255,255,.55)}

/* Xương sống hành trình: dải nối dày mỏng theo số khách CÒN LẠI, phần rơi
   ra vẽ tách xuống dưới. Đây là chỗ thể hiện tương quan giữa các bước. */
.spine{display:flex;align-items:stretch;overflow-x:auto;padding:3px 2px 2px}
.spine .sn{flex:1 1 0;min-width:134px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;text-align:left}
.spine .sn:hover{border-color:var(--primary-line)}
.spine .sn.watch{background:var(--watch-bg);border-color:var(--watch-line)}
.spine .sn.crit{background:var(--crit-bg);border-color:var(--crit-line)}
.spine .sn.unknown{border-style:dashed}
.spine .sn.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.spine .sc{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink3);letter-spacing:.06em}
.spine .snm{font-size:12.5px;font-weight:650;line-height:1.3;margin:6px 0 9px;min-height:33px}
.spine .sv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.spine .sl{font-size:12px;color:var(--ink2);margin-top:2px}
.spine .smeter{margin-top:8px;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.spine .smeter>i{display:block;height:100%}
.cx{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;padding-top:54px}
.cxband{width:100%;position:relative}
.cxpass{position:absolute;left:0;right:0;top:0;background:linear-gradient(90deg,rgba(140,134,129,.34),rgba(140,134,129,.14));border-top:1px solid #C9C3BC;border-bottom:1px solid #C9C3BC}
.cxloss{position:absolute;left:0;right:0;min-height:3px;border-radius:0 0 5px 5px;
  background:repeating-linear-gradient(45deg,var(--crit),var(--crit) 3px,#8F2A23 3px,#8F2A23 6px)}
.cxlbl{margin-top:9px;text-align:center;white-space:nowrap}
.cxlbl b{display:block;font:700 13px/1.2 ui-monospace,Menlo,monospace;color:var(--crit)}
.cxlbl span{display:block;font-size:12px;color:var(--ink3);font-weight:600}
/* Màn hẹp: thu dải nối lại để nhét đủ 6 bước.
   KHÔNG thu `.sn` xuống dưới ~132px được: badge "Cần xử lý ngay" có
   white-space:nowrap theo quy tắc trạng thái, hẹp hơn là badge tràn ra.
   Từ ~1400px trở lên vừa đủ; hẹp hơn nữa thì `.spine` cuộn ngang có chủ ý
   (thanh cuộn của khung, không phải của cả trang) — xem spec §9.5. */
@media (max-width:1500px){
  .cx{width:52px}
  .spine .sn{min-width:132px}
}

/* ===================== MÀN CHỈ SỐ & NGƯỠNG ===================== */
.cfl{min-width:0}
.cfl b{font-size:13.5px;display:block;line-height:1.35}
.cfl span{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.cfgrid{display:grid;gap:14px 18px;align-items:center}
.num-in{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;outline:none}
.num-in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.num-in.w{border-color:var(--watch-line);background:var(--watch-bg)}
.num-in.c{border-color:var(--crit-line);background:var(--crit-bg)}
.sel-in{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:600;outline:none}
.sel-in:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:#D6D1CB;
  position:relative;cursor:pointer;flex:none;margin:0;transition:background .12s}
.sw input:checked{background:var(--primary)}
.sw input::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .12s}
.sw input:checked::after{transform:translateX(16px)}
.sw input:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-ring)}

/* ===================== BẢNG XỬ LÝ — 4 làn việc đang chạy =====================
   Cố ý KHÔNG có làn "đã xong": việc đã khép vòng rời board, chỉ tìm thấy khi
   chủ động mở khối cuối màn. Board là hàng đợi cần tay người, không phải kho. */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;align-items:start}
.lane{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.lane.hot{background:var(--crit-bg);border-color:var(--crit-line)}
.lane>.lh{display:flex;align-items:center;gap:8px;padding:2px 3px 8px}
.lane>.lh .lnum{width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line);font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink3)}
.lane>.lh b{font-size:13px;font-weight:650;min-width:0}
.lane>.lh .lc{margin-left:auto;flex:none;font:700 13px/1 ui-monospace,Menlo,monospace;color:var(--ink2)}
.lane>.lsub{padding:0 3px 9px;font-size:12px;color:var(--ink3);line-height:1.35}
.lane>.lbody{display:grid;gap:8px}
.wk{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font:inherit;color:inherit;cursor:pointer}
.wk:hover{border-color:var(--primary-line);background:var(--primary-soft)}
.wk.crit{box-shadow:inset 3px 0 0 var(--crit)}
.wk.watch{box-shadow:inset 3px 0 0 var(--watch)}
.wk .wkid{display:flex;align-items:center;gap:7px;font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink3)}
.wk .wkt{font-size:13px;font-weight:650;line-height:1.35;margin:7px 0 8px}
.wk .wkm{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wk .wkp{margin-left:auto;flex:none;font:700 15px/1 ui-monospace,Menlo,monospace;color:var(--ink)}
.laneempty{padding:15px 10px;text-align:center;font-size:12px;color:var(--ink3);
  border:1px dashed var(--line);border-radius:9px;background:rgba(255,255,255,.5)}

/* ===================== TAXONOMY 2 CỘT =====================
   Vào màn chỉ thấy tầng đầu. Bấm một node mới hiện con của nó ở cột phải. */
.tnode{display:block;width:100%;text-align:left;background:none;border:none;border-radius:9px;
  padding:8px 9px;font:inherit;color:inherit;cursor:pointer}
.tnode:hover{background:var(--surface2)}
.tnode.on{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
.tnode .tr1{display:flex;align-items:center;gap:8px}
.tnode .tr1 b{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .tr1 .tn{margin-left:auto;flex:none;font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink2)}
.tbar{margin-top:6px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.tbar>i{display:block;height:100%;border-radius:3px;background:var(--ink3)}
.tnode.on .tbar>i{background:var(--primary)}
.srchin{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;outline:none}
.srchin:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}

/* ===================== MENU NHÓM CẤU HÌNH (#/rules) ===================== */
.rnav{display:flex;flex-direction:column;gap:2px;padding:9px}
.rnav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;
  border-radius:9px;padding:9px 11px;font-size:13px;font-weight:600;color:var(--ink2)}
.rnav button:hover{background:var(--surface2);color:var(--ink)}
.rnav button.on{background:var(--primary-soft);color:var(--primary-hover);box-shadow:inset 3px 0 0 var(--primary)}
.rnav button i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}
.rnav button .n{margin-left:auto;flex:none;font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink3)}
.rnav .rg{padding:12px 11px 5px;font:700 12px/1.2 ui-monospace,Menlo,monospace;
  text-transform:uppercase;letter-spacing:.11em;color:var(--ink3)}

/* ===================== TABS / DISCLOSURE ===================== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 17px}
.tabs button{border:none;background:none;padding:11px 13px;font-size:13px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.disc{border:none;background:none;padding:0;color:var(--primary);font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:5px}
.disc:hover{text-decoration:underline}
.quote{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:9px;padding:12px 13px}
.quote p{margin:0;font-size:14px;line-height:1.5}
.quote .qm{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;font-weight:600}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--ink2)}
.note.warn{background:var(--watch-bg);border-color:var(--watch-line)}
.note.crit{background:var(--crit-bg);border-color:var(--crit-line)}
.note.bd{background:var(--primary-soft);border-color:var(--primary-line)}
.empty{padding:40px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ===================== TOUR SPOTLIGHT ===================== */
/* Coach-mark: #tourmask bắt click toàn màn để không bấm nhầm ra ngoài tour;
   #tourhole khoét sáng component đích bằng box-shadow lan rộng; #tourpop là
   popover giải thích, neo cạnh component. */
#tourmask{position:fixed;inset:0;z-index:60;display:none}
#tourmask.on{display:block}
#tourhole{position:absolute;border-radius:10px;border:2px solid var(--primary);
  box-shadow:0 0 0 9999px rgba(23,20,17,.60);transition:left .22s,top .22s,width .22s,height .22s;pointer-events:none}
#tourpop{position:fixed;z-index:61;width:344px;max-width:88vw;background:#fff;
  border:1px solid var(--line);border-radius:13px;box-shadow:0 20px 54px rgba(0,0,0,.32);
  padding:15px 17px 14px;display:none}
#tourpop.on{display:block}
#tourpop .tn{font:700 11.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.09em;color:var(--primary)}
#tourpop b{display:block;font-size:15px;margin:7px 0 5px}
#tourpop p{font-size:13px;line-height:1.55;color:var(--ink2);margin:0}
#tourpop .tb{margin-top:13px;display:flex;gap:7px;align-items:center}
#tourpop .tb button{border:1px solid var(--line);background:#fff;color:var(--ink1);border-radius:8px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
#tourpop .tb button:hover{background:var(--wash)}
#tourpop .tb button.pri{border-color:var(--primary);background:var(--primary);color:#fff}
#tourpop .tb button.x{margin-left:auto;border-color:transparent;background:none;color:var(--ink3)}

.mono{font-family:ui-monospace,Menlo,monospace}
.hr{height:1px;background:var(--line);margin:16px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

/* Chạy một saved query dạng `show`. Trả về đủ thứ một widget cần để tự mô tả:
   rows đã xếp, tổng, số đang hiện trên tổng số, nhãn trục. */
function qRun(q, limit) {
  const d = DIMS[q.show];
  if (!d) return { rows:[], total:0, shown:0, all:0, axis:'', dim:'?' };
  const all = d.rows().sort((a, b) => b.v - a.v);
  const total = all.reduce((a, r) => a + r.v, 0);
  const n = limit || (q.chart === 'donut' ? all.length : Math.min(all.length, 10));
  return { rows:all.slice(0, n), total, shown:Math.min(n, all.length), all:all.length,
           axis:q.metric === 'pct' ? '% trên tổng' : BASE_AXIS[d.base], dim:d.label, base:d.base, unit:d.unit };
}

/* Z-score theo đúng định nghĩa Enterpret: số độ lệch chuẩn mà điểm cuối nằm cách
   trung bình của các kỳ TRƯỚC đó. Trả về null khi chưa đủ mẫu hoặc phương sai 0. */
function zScores(points) {
  return points.map((v, i) => {
    if (i < 2) return null;
    const prev = points.slice(0, i);
    const mean = prev.reduce((a, b) => a + b, 0) / prev.length;
    const sd = Math.sqrt(prev.reduce((a, b) => a + (b - mean) ** 2, 0) / prev.length);
    return sd === 0 ? null : (v - mean) / sd;
  });
}

/* Nhãn trạng thái — luôn có CHỮ, không bao giờ chỉ có màu */
const ST_LABEL = { ok:'Đang kiểm soát', watch:'Cần theo dõi', crit:'Cần xử lý ngay', unknown:'Chưa đo được' };
const badge = (s, txt) => `<span class="st ${s}">${s==='ok'?'✓ ':s==='unknown'?'— ':''}${esc(txt || ST_LABEL[s])}</span>`;
const SEV = { critical:'crit', high:'watch', medium:'ok' };
const SEV_LABEL = { critical:'Cần xử lý ngay', high:'Cần theo dõi', medium:'Đang quan sát' };

/* ---------- Trạng thái SUY RA TỪ NGƯỠNG, không hardcode trong fixture ----------
   Ba hàm dưới đây là chỗ duy nhất quyết định một thứ đang "Đang kiểm soát",
   "Cần theo dõi" hay "Cần xử lý ngay". Mọi màn đều gọi qua đây. */

/* Bước: tỷ lệ thất bại là tiêu chí chính; coverage thấp hoặc effort cao thì
   ít nhất phải Cần theo dõi — thấy thất bại mà không biết vì sao cũng là vấn đề. */
const failRate = (o) => (o && o.entered ? (o.failed / o.entered) * 100 : 0);
function stepState(o) {
  if (!o) return 'unknown';
  const fr = failRate(o);
  let s = fr >= CFG.step.failCrit ? 'crit' : fr >= CFG.step.failWatch ? 'watch' : 'ok';
  if (s === 'ok' && (o.cov < CFG.step.covMin || o.effort > CFG.step.effortMax)) s = 'watch';
  return s;
}
/* Lý do bước bị gắn nhãn — để UI giải thích được, không chỉ tô màu */
function stepWhy(o) {
  if (!o) return 'Chưa có dữ liệu quan sát';
  const r = [], fr = failRate(o);
  if (fr >= CFG.step.failCrit)      r.push(`thất bại ${fr.toFixed(1).replace('.',',')}% ≥ ngưỡng xử lý ${CFG.step.failCrit}%`);
  else if (fr >= CFG.step.failWatch) r.push(`thất bại ${fr.toFixed(1).replace('.',',')}% ≥ ngưỡng theo dõi ${CFG.step.failWatch}%`);
  if (o.cov < CFG.step.covMin)      r.push(`evidence coverage ${o.cov}% dưới ngưỡng ${CFG.step.covMin}%`);
  if (o.effort > CFG.step.effortMax) r.push(`effort ${String(o.effort).replace('.',',')} vượt ${String(CFG.step.effortMax).replace('.',',')} lần thử`);
  return r.length ? r.join(' · ') : 'mọi tiêu chí trong ngưỡng';
}

/* Metric: band riêng từng metric, hướng lấy từ dấu ≥ / ≤ của target */
const mdir = (m) => (String(m.target).indexOf('≤') > -1 ? 'down' : 'up');
const mval = (m) => parseFloat(String(m.value).replace(',', '.'));
function metricState(m) {
  const c = CFG.metric[m.id];
  if (!c || !c.on) return 'unknown';
  const v = mval(m);
  if (isNaN(v)) return 'unknown';
  if (mdir(m) === 'down') return v > c.crit ? 'crit' : v > c.watch ? 'watch' : 'ok';
  return v < c.crit ? 'crit' : v < c.watch ? 'watch' : 'ok';
}
const metricBadge = (m) => (CFG.metric[m.id] && !CFG.metric[m.id].on
  ? badge('unknown', 'Không theo dõi') : badge(metricState(m)));

/* Nguồn: im lặng quá deadDays là chết; trễ hơn SLA riêng của nguồn là trễ */
function sourceHealth(s) {
  if (s.lagH == null || s.lagH >= CFG.data.deadDays * 24) return 'down';
  return s.lagH > (CFG.source[s.id] != null ? CFG.source[s.id] : 6) ? 'stale' : 'ok';
}
const freshLabel = (h) => (h == null ? '—' : h < 24 ? `trễ ${h} giờ`
  : `trễ ${Math.round(h / 24 * 10) / 10}`.replace('.', ',') + ' ngày');

/* QUY TẮC DENOMINATOR: mọi card/chart hiện "X of Y đơn vị" + kỳ ngày tuyệt đối */
const denom = (shown, total, unit) =>
  `<div class="denom">${shown} of ${total} ${esc(unit)}<br>${period().range}</div>`;

const chead = (title, sub, shown, total, unit, right) => `
  <div class="chead">
    <div class="ct"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>
    ${right || (shown != null ? denom(shown, total, unit) : '')}
  </div>`;

/* Số liệu neo — mỗi số kèm nguồn + độ tươi + cỡ mẫu (quy tắc thứ ba của ta) */
const stat = (label, value, foot, srcNote, tone) => `
  <div class="stat">
    <div class="t-lbl">${esc(label)}</div>
    <div class="t-num" ${tone ? `style="color:${tone}"` : ''}>${value}</div>
    ${foot ? `<div class="foot">${esc(foot)}</div>` : ''}
    ${srcNote ? `<div class="src">${esc(srcNote)}</div>` : ''}
  </div>`;

const catChip = (c) => `<span class="chip" style="color:${DATA.cats[c].color};border-color:currentColor">${DATA.cats[c].label}</span>`;
const taxPath = (ids) => ids.map((i) => tax(i)).filter((n) => n && n.level !== 'theme' && n.lv !== 'theme')
  .map((n) => esc(n.name)).join(' › ');
const taxPathAll = (ids) => ids.map((i) => tax(i)).filter(Boolean).map((n) => esc(n.name)).join(' › ');

/* Vẽ chart bằng CSS thuần — cố ý không dùng thư viện để file vẫn đọc/sửa được */
function barChart(series, scaleFactor) {
  const max = Math.max(...series.map((s) => s.v)) || 1;
  return `<div class="bars">${series.map((s) => {
    const v = scaleFactor ? fx(s.v) : s.v;
    return `<div class="bar">
      <div class="bn"><i style="background:${s.c || 'var(--ink3)'}"></i><span title="${esc(s.l)}">${esc(s.l)}</span></div>
      <div class="bv">${nf(v)}</div>
      <div class="bt"><i style="width:${Math.max(2, (s.v / max) * 100)}%;background:${s.c || 'var(--ink3)'}"></i></div>
    </div>`;
  }).join('')}</div>`;
}
function lineChart(seriesList) {
  const colors = ['var(--crit)', 'var(--ink3)'];
  const all = seriesList.flatMap((s) => s.p);
  const mx = Math.max(...all), mn = Math.min(...all);
  const span = mx - mn || 1;
  const W = 560, H = 130, pad = 6;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px" role="img">
    ${[0,1,2,3].map((i)=>`<line x1="0" y1="${pad+i*(H-2*pad)/3}" x2="${W}" y2="${pad+i*(H-2*pad)/3}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${seriesList.map((s, si) => {
      const pts = s.p.map((v, i) => {
        const x = (i / (s.p.length - 1)) * (W - 10) + 5;
        const y = H - pad - ((v - mn) / span) * (H - 2 * pad);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="${colors[si] || 'var(--ink3)'}" stroke-width="2.5" stroke-linejoin="round"/>
        ${s.p.map((v, i) => {
          const x = (i / (s.p.length - 1)) * (W - 10) + 5;
          const y = H - pad - ((v - mn) / span) * (H - 2 * pad);
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${colors[si] || 'var(--ink3)'}"/>`;
        }).join('')}`;
    }).join('')}
  </svg>
  <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">${seriesList.map((s, si) =>
    `<span style="font-size:12.5px;display:flex;align-items:center;gap:6px">
      <i style="width:14px;height:3px;background:${colors[si] || 'var(--ink3)'};display:inline-block"></i>
      ${esc(s.l)} · cuối kỳ <b class="num">${s.p[s.p.length - 1]}</b></span>`).join('')}</div>`;
}
function sparkline(points, color) {
  const mx = Math.max(...points) || 1;
  return `<div class="spark">${points.map((p) => `<i style="height:${Math.max(6,(p/mx)*100)}%;background:${color}"></i>`).join('')}</div>`;
}

/* ==========================================================================
   ===== 2b. validateFixture() — KIỂM TOÀN VẸN DỮ LIỆU =====
   Chạy trên TOÀN BỘ fixture, không chỉ một phần. Lỗi hiện thành banner đỏ
   ngay trong UI. Nếu bạn sửa DATA ở trên mà làm đứt một liên kết, banner sẽ
   nói chính xác chỗ nào sai — đây là lưới an toàn cho người sửa file.
   ========================================================================== */
function validateFixture() {
  const e = [];
  const has = (arr, id, k = 'id') => arr.some((x) => x[k] === id);

  /* 1 · ID trùng trên toàn bộ collection */
  const allIds = [].concat(
    DATA.steps.map((x) => x.id), DATA.metrics.map((x) => x.id), DATA.ev.map((x) => x.id),
    DATA.iss.map((x) => x.id), ACT.map((x) => x.id), DATA.sources.map((x) => x.id),
    DATA.surveys.map((x) => x.id), DATA.tax.map((x) => x.id), DATA.ins.map((x) => x.id),
    DATA.qt.map((x) => x.id), DATA.dash.map((x) => x.id), DATA.flows.map((x) => x.id),
  );
  allIds.filter((id, i) => allIds.indexOf(id) !== i).forEach((id) => e.push(`ID trùng: ${id}`));

  /* 8 · stationId phải có và duy nhất */
  const stations = DATA.steps.map((s) => s.stationId);
  DATA.steps.forEach((s) => { if (!s.stationId) e.push(`${s.id}: thiếu stationId`); });
  stations.filter((x, i) => stations.indexOf(x) !== i).forEach((x) => e.push(`stationId trùng: ${x}`));

  /* 2,3,7,10,11 · Issue */
  DATA.iss.forEach((i) => {
    if (!has(DATA.steps, i.step))    e.push(`${i.id}: step ${i.step} không tồn tại`);
    if (!has(DATA.metrics, i.metric))e.push(`${i.id}: metric ${i.metric} không tồn tại`);
    if (!has(ACT, i.act))            e.push(`${i.id}: action ${i.act} không tồn tại`);
    const a = action(i.act);
    if (a && a.iss !== i.id)         e.push(`${i.id}: action ${i.act} liên kết ngược sai (trỏ về ${a.iss})`);
    if (i.ins && !has(DATA.ins, i.ins)) e.push(`${i.id}: insight ${i.ins} không tồn tại`);
    i.ev.forEach((id) => {
      const x = ev(id);
      if (!x) return e.push(`${i.id}: evidence ${id} không tồn tại`);
      if (x.step !== i.step) e.push(`${i.id}: evidence ${id} thuộc bước ${x.step}, khác bước của issue (${i.step})`);
    });
    i.cust.forEach((k) => { if (!cust(k)) e.push(`${i.id}: khách ${k} không có trong fixture khách hàng`); });
    const sum = i.pri.sev + i.pri.aff + i.pri.jc + i.pri.rep + i.pri.tr + i.pri.reg;
    if (sum !== i.pri.total) e.push(`${i.id}: priority.total = ${i.pri.total} nhưng tổng thành phần = ${sum}`);
  });

  /* 4 · Action — thứ tự trạng thái không được đảo */
  ACT.forEach((a) => {
    if (!has(DATA.iss, a.iss))       e.push(`${a.id}: issue ${a.iss} không tồn tại`);
    if (!has(DATA.metrics, a.sm))    e.push(`${a.id}: success metric ${a.sm} không tồn tại`);
    const i = iss(a.iss);
    if (i && i.act !== a.id)         e.push(`${a.id}: issue ${a.iss} không trỏ ngược về action này`);
    if (a.ap !== 'approved' && a.dl !== 'backlog')       e.push(`${a.id}: đã triển khai trước khi được duyệt`);
    if (a.dl !== 'released' && a.iv !== 'not-started')   e.push(`${a.id}: đang đánh giá trước khi phát hành`);
    if (a.dl !== 'released' && outc(a.id))              e.push(`${a.id}: có outcome trước khi phát hành`);
    if (a.iv === 'validated' && !outc(a.id))            e.push(`${a.id}: đã xác nhận kết quả nhưng thiếu dữ liệu quan sát`);
    if (a.lc !== 'blocked' && a.iv !== 'validated')      e.push(`${a.id}: khép vòng trước khi xác nhận kết quả`);
  });

  /* 5 · Voice Insight handoff */
  DATA.ins.forEach((v) => {
    if (!has(DATA.tax, v.theme))   e.push(`${v.id}: theme node ${v.theme} không tồn tại`);
    if (v.step && !has(DATA.steps, v.step)) e.push(`${v.id}: step ${v.step} không tồn tại`);
    v.src.forEach((s) => { if (!has(DATA.sources, s)) e.push(`${v.id}: nguồn ${s} không tồn tại`); });
    v.ev.forEach((x) => { if (!ev(x)) e.push(`${v.id}: evidence ${x} không tồn tại`); });
    if (v.hoIssue && !has(DATA.iss, v.hoIssue)) e.push(`${v.id}: handoff trỏ tới issue ${v.hoIssue} không tồn tại`);
    if (!v.hoEl && v.hoIssue)      e.push(`${v.id}: chưa đủ điều kiện handoff nhưng vẫn gắn issue`);
  });

  /* 6 · Nguồn, khảo sát */
  DATA.ev.forEach((x) => { if (!has(DATA.sources, x.src)) e.push(`${x.id}: nguồn ${x.src} không tồn tại`); });
  DATA.sources.forEach((s) => s.metrics.forEach((m) => { if (!has(DATA.metrics, m)) e.push(`${s.id}: metric ${m} không tồn tại`); }));
  DATA.surveys.forEach((s) => {
    const known = DATA.signals.some((g) => s.trigger.indexOf(g.name) === 0);
    const campaign = s.trigger.indexOf('Chiến dịch') === 0;
    const external = ['deposit_credited','cs_session_closed','account_open_abandoned','account_open_completed','order_matched']
      .some((n) => s.trigger.indexOf(n) === 0 || s.trigger.indexOf(n) > -1);
    if (!known && !campaign && !external) e.push(`${s.id}: trigger "${s.trigger}" không khớp signal nào`);
  });

  /* 9 · Signal luồng tiền phải lấy server làm nguồn sự thật */
  const moneyGroups = ['g-in','g-out'];
  const moneyFlows = DATA.flows.filter((f) => moneyGroups.indexOf(f.groupId) > -1).map((f) => f.id);
  DATA.signals.forEach((g) => {
    const tp = DATA.touchpoints.find((t) => t.id === g.tpId);
    const st = tp && step(tp.stepId);
    if (st && moneyFlows.indexOf(st.flowId) > -1 && g.eventSource !== 'server')
      e.push(`${g.name}: signal luồng tiền phải có eventSource = server`);
  });

  /* 11 · Taxonomy — L1/L2/theme bắt buộc, L3/subtheme tùy chọn */
  DATA.tax.forEach((n) => {
    if (n.p && !has(DATA.tax, n.p)) e.push(`taxonomy ${n.id}: parent ${n.p} không tồn tại`);
    const up = { L2:'L1', L3:'L2', subtheme:'theme' }[n.lv];
    if (up && n.p && tax(n.p).lv !== up) e.push(`taxonomy ${n.id} (${n.lv}): parent phải ở tầng ${up}`);
    if (n.lv === 'L1' && n.p) e.push(`taxonomy ${n.id}: L1 không được có parent`);
  });
  DATA.ev.forEach((x) => {
    const lv = (l) => x.tax.map((t) => tax(t)).filter((t) => t && t.lv === l);
    ['L1','L2','theme'].forEach((l) => {
      const c = lv(l).length;
      if (c !== 1) e.push(`${x.id}: phải có đúng 1 node ${l}, đang có ${c}`);
    });
    ['L3','subtheme'].forEach((l) => { if (lv(l).length > 1) e.push(`${x.id}: có nhiều hơn 1 node ${l}`); });
    lv('subtheme').forEach((sb) => { if (x.tax.indexOf(sb.p) === -1) e.push(`${x.id}: có sub-theme ${sb.name} nhưng thiếu theme cha`); });
    x.tax.forEach((t) => { if (!tax(t)) e.push(`${x.id}: taxonomy node ${t} không tồn tại`); });
  });

  /* 12,13 · Artifact và Agent */
  /* Set dashboard: thuộc đúng một phần, mỗi phần có đúng một set mặc định,
     và mọi block phải trỏ tới thứ có thật. */
  ['voc','cxm'].forEach((sec) => {
    const ss = DATA.dash.filter((d) => d.sec === sec);
    if (!ss.length) e.push(`phần ${sec}: không có set dashboard nào`);
    const defs = ss.filter((d) => d.def).length;
    if (defs !== 1) e.push(`phần ${sec}: phải có đúng 1 set mặc định, đang có ${defs}`);
  });
  DATA.dash.forEach((d) => {
    if (['voc','cxm'].indexOf(d.sec) === -1) e.push(`${d.id}: sec "${d.sec}" phải là voc hoặc cxm`);
    if (!CFG.sub[d.id]) e.push(`${d.id}: thiếu cấu hình bản tin trong CFG.sub`);
    (d.qs || []).forEach((qq, i) => {
      if (!qq.q) e.push(`${d.id} câu ${i + 1}: thiếu câu hỏi`);
      qq.b.forEach((b) => {
        if (b[0] === '@') {
          if (!BLOCKS[b]) return e.push(`${d.id} câu ${i + 1}: khối "${b}" không tồn tại`);
          if (BLOCKS[b].sec !== d.sec) e.push(`${d.id} câu ${i + 1}: khối "${b}" thuộc phần ${BLOCKS[b].sec}, không phải ${d.sec}`);
          if (!V[BLOCKS[b].go]) e.push(`khối "${b}": drill-down tới route "${BLOCKS[b].go}" không tồn tại`);
        } else if (!qt(b)) e.push(`${d.id} câu ${i + 1}: Quantify ${b} không tồn tại`);
      });
    });
  });
  Object.keys(CFG.sub).forEach((k) => { if (!byId(DATA.dash, k)) e.push(`CFG.sub: set ${k} không tồn tại`); });
  DATA.ag.forEach((a) => a.f.forEach((f) => f.ev.forEach((x) => { if (!ev(x)) e.push(`${f.id}: evidence ${x} không tồn tại`); })));
  DATA.loop.forEach((l) => {
    if (!has(DATA.iss, l.iss)) e.push(`close-loop: issue ${l.iss} không tồn tại`);
    if (l.done > l.need)       e.push(`close-loop ${l.iss}: đã liên hệ (${l.done}) nhiều hơn số cần (${l.need})`);
  });
  DATA.out.forEach((o) => { if (!has(ACT, o.act)) e.push(`outcome: action ${o.act} không tồn tại`); });

  /* 14 · CẤU TRÚC BẢN ĐỒ — phase → nhóm → flow */
  DATA.groups.forEach((g) => { if (!has(DATA.phases, g.phaseId)) e.push(`nhóm ${g.id}: phase ${g.phaseId} không tồn tại`); });
  DATA.flows.forEach((f) => { if (!has(DATA.groups, f.groupId)) e.push(`flow ${f.id}: nhóm ${f.groupId} không tồn tại`); });

  /* 15 · PROVENANCE — phép kiểm ngăn đúng lỗi đã xảy ra.
     Bản trước có 5 flow trỏ tới Money Journey sơ đồ 9/10/12/13/14 trong khi
     Money Journey chỉ có 7 sơ đồ. Không ai phát hiện vì không có gì kiểm.
     Account Journey: 13 sơ đồ · Money Journey: 7 sơ đồ. */
  const DIAGRAMS = { 'Account Journey':13, 'Money Journey':7 };
  DATA.flows.forEach((f) => {
    const noSrc = f.src === '—';
    if (f.verified === noSrc) e.push(`flow ${f.id}: verified=${f.verified} nhưng src="${f.src}" — hai giá trị này phải ngược nhau`);
    if (noSrc) return;
    const m = /^(Account Journey|Money Journey) · Sơ đồ (\d+)( & (\d+))?$/.exec(f.src);
    if (!m) return e.push(`flow ${f.id}: src "${f.src}" sai định dạng, phải là "<Account|Money> Journey · Sơ đồ N" hoặc "... Sơ đồ N & M"`);
    const max = DIAGRAMS[m[1]];
    [m[2], m[4]].filter(Boolean).map(Number).forEach((n) => {
      if (n < 1 || n > max) e.push(`flow ${f.id}: src trỏ tới ${m[1]} sơ đồ ${n}, nhưng ${m[1]} chỉ có ${max} sơ đồ`);
    });
  });
  DATA.flows.forEach((f) => {
    const st = DATA.steps.filter((s) => s.flowId === f.id);
    if (f.observed && !st.length) e.push(`flow ${f.id}: observed=true nhưng không có bước nào`);
    if (f.observed) st.forEach((s) => { if (!obs(s.id)) e.push(`flow ${f.id}: bước ${s.id} thiếu dữ liệu quan sát`); });
    if (!f.observed && st.length) e.push(`flow ${f.id}: có ${st.length} bước nhưng observed=false`);
  });

  /* 16 · TAXONOMY gióng bản đồ.
     CHỈ L1 ràng buộc 1–1 với phase. L2/L3 cố ý KHÔNG ép 1–1 với nhóm/flow —
     x-l2-ekyc và x-l2-sign nằm BÊN TRONG một flow, x-l2-hotl và x-l2-claim
     cùng trỏ một nhóm. Ép 1–1 sẽ buộc xóa chúng và làm 20/22 record ev mất
     đường dẫn taxonomy. */
  const l1 = taxLv('L1');
  if (l1.length !== DATA.phases.length) e.push(`taxonomy: có ${l1.length} node L1 nhưng ${DATA.phases.length} phase — L1 phải khớp 1–1 với phase`);
  const l1maps = l1.map((t) => t.maps);
  l1.forEach((t) => {
    if (!t.maps) return e.push(`taxonomy ${t.id}: L1 bắt buộc có maps trỏ tới một phase`);
    if (!has(DATA.phases, t.maps)) e.push(`taxonomy ${t.id}: maps "${t.maps}" không phải phase nào`);
  });
  l1maps.filter((m, i) => m && l1maps.indexOf(m) !== i).forEach((m) => e.push(`taxonomy: hai node L1 cùng maps tới phase ${m}`));
  DATA.tax.filter((t) => t.lv === 'L2' || t.lv === 'L3').forEach((t) => {
    if (t.maps === undefined) return e.push(`taxonomy ${t.id}: thiếu trường maps (dùng null nếu chưa gắn được điểm chạm)`);
    if (t.maps === null) return;
    if (!has(DATA.groups, t.maps) && !has(DATA.flows, t.maps) && !has(DATA.steps, t.maps))
      e.push(`taxonomy ${t.id}: maps "${t.maps}" không phải nhóm, flow hay bước nào`);
  });
  /* Tổng con KHÔNG ĐƯỢC VƯỢT cha. Cho phép nhỏ hơn: không phải bản ghi nào cũng
     được phân loại xuống tầng sâu nhất — Enterpret cũng vậy ("Top 10 of 60"). */
  DATA.tax.forEach((p) => {
    const kids = DATA.tax.filter((k) => k.p === p.id);
    if (!kids.length) return;
    const sum = kids.reduce((a, k) => a + k.n, 0);
    if (sum > p.n) e.push(`taxonomy ${p.id} "${p.name}": tổng ${kids.length} node con = ${sum}, vượt quá ${p.n} của node cha`);
  });

  /* 17 · Saved Quantify phải trỏ tới chiều có thật */
  DATA.qt.forEach((q) => {
    if (q.kind === 'show' && !DIMS[q.show]) e.push(`Quantify ${q.id}: chiều "${q.show}" không tồn tại`);
    if (q.kind === 'show' && !METRICS[q.metric]) e.push(`Quantify ${q.id}: chỉ số "${q.metric}" không tồn tại`);
    if (!CHARTS[q.chart]) e.push(`Quantify ${q.id}: kiểu chart "${q.chart}" không tồn tại`);
    if (q.kind === 'series' && q.shown > q.total) e.push(`Quantify ${q.id}: shown ${q.shown} > total ${q.total}`);
  });

  /* 18 · Guided tour phải trỏ route CÓ THẬT và khai đủ selector + nhãn nhóm.
     tourEnter() gọi go(r) trực tiếp nên route sai làm hỏng giữa buổi trình bày;
     thiếu sel/grp thì popover trống hoặc mất nhãn bước. (Anchor có tồn tại thật
     hay không thì kiểm lúc chạy trong tourShow — fallback về giữa màn.) */
  DATA.tour.forEach((t, i) => {
    if (!V[t.r]) e.push(`tour bước ${i + 1}: route "${t.r}" không tồn tại`);
    if (!t.sel) e.push(`tour bước ${i + 1}: thiếu selector "sel"`);
    if (!t.grp) e.push(`tour bước ${i + 1}: thiếu nhãn nhóm "grp"`);
  });
  DATA.nav.filter((n) => n.r).forEach((n) => { if (!V[n.r]) e.push(`nav "${n.l}": route "${n.r}" không tồn tại`); });

  return e;
}

/* ==========================================================================
   ===== 3. VIEWS — mỗi route một hàm trả về HTML =====
   Mọi màn theo khuôn 4 tầng: Kết luận → Số liệu neo → Danh sách ưu tiên → Hồ sơ.
   ========================================================================== */
const V = {};

/* ---------- Tổng quan (Dashboard) ---------- */
/* ---------- Bộ khung widget theo đúng anatomy Enterpret ----------
   Bốn phần đầu giống nhau ở MỌI widget. Đây là thứ làm màn hình đọc ra
   customer intelligence platform chứ không phải một trang BI chung chung:
     1. tiêu đề
     2. khoảng thời gian tuyệt đối
     3. "Đang hiện Top N trên M <đơn vị>"
     4. nhãn trục nêu rõ đang đếm cái gì
   Bỏ bất kỳ phần nào là người xem mất một mảnh ngữ cảnh cần để tin con số. */
const wHead = (title, shown, total, unit) => `
  <div class="chead">
    <div class="ct"><b>${esc(title)}</b><span>${esc(period().label)} (${esc(period().range)})</span></div>
    <div class="denom">Đang hiện Top ${shown}<br>trên ${total} ${esc(unit)}</div>
  </div>`;

/* Thanh xếp hạng bấm được. `kids` treo chip sub-theme NGAY DƯỚI thanh cha,
   đúng cách Enterpret trình bày breakdown by Sub-Themes. */
function rankBars(rows, o) {
  o = o || {};
  const max = Math.max(...rows.map((r) => r.v), 1);
  const tot = o.total || rows.reduce((a, r) => a + r.v, 0);
  return `<div class="bars">${rows.map((r) => {
    const kids = o.kids ? o.kids(r) : [];
    const act = o.click ? `onclick="${o.click(r)}"` : '';
    return `<div class="bar ${o.click ? 'clickable' : ''}" ${act} ${o.click ? 'role="button" tabindex="0"' : ''}
              title="${esc(r.l)} — ${nf(fx(r.v))} (${pv(r.v, tot)}%)">
      <div class="bn"><i style="background:${r.c || 'var(--ink3)'}"></i><span>${esc(r.l)}</span></div>
      <div class="bv">${o.pctMode ? pv(r.v, tot) + '%' : nf(fx(r.v))}</div>
      <div class="bt"><i style="width:${Math.max(2, (r.v / max) * 100)}%;background:${r.c || 'var(--ink3)'}"></i></div>
      ${kids.length ? `<div class="bkids">${kids.map((k) =>
        `<span class="chip">${esc(k.name)} <b class="mono">${nf(fx(k.n))}</b></span>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

const axisLbl = (t) => `<div class="axis">${esc(t)}</div>`;

/* Donut thuần CSS bằng conic-gradient — không thư viện, vẫn đọc và sửa được */
function donut(rows, total, centerBig, centerSmall) {
  const PAL = ['var(--primary)','#7A8B99','#A8B4BD','#C6CDD2','#DDE1E4','#EBEDEF','#F4F5F6'];
  let acc = 0;
  const stops = rows.map((r, i) => {
    const a = (r.v / (total || 1)) * 360, s = acc; acc += a;
    return `${r.c || PAL[i % PAL.length]} ${s.toFixed(2)}deg ${acc.toFixed(2)}deg`;
  }).join(',');
  return `<div class="donutwrap">
    <div class="donut" style="background:conic-gradient(${stops || 'var(--line) 0deg 360deg'})">
      <div class="dcenter"><b>${centerBig}</b><span>${esc(centerSmall)}</span></div>
    </div>
    <div class="dlegend">${rows.map((r, i) => `
      <div><i style="background:${r.c || PAL[i % PAL.length]}"></i>
        <span>${esc(r.l)}</span><b class="mono">${pv(r.v, total)}%</b></div>`).join('')}</div>
  </div>`;
}

/* Bar + Trend + Anomaly. Điểm vượt ngưỡng Z-score được khoanh và ghi rõ Z bao nhiêu —
   hover thấy chính xác con số, đúng cách Enterpret làm. */
function anomalyChart(seriesList) {
  const all = seriesList.flatMap((s) => s.p);
  const mx = Math.max(...all), mn = Math.min(0, ...all), span = mx - mn || 1;
  const W = 560, H = 150, pad = 10;
  const COL = ['var(--crit)', 'var(--ink3)'];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:170px" role="img">
    ${[0,1,2,3].map((i)=>`<line x1="0" y1="${pad+i*(H-2*pad)/3}" x2="${W}" y2="${pad+i*(H-2*pad)/3}" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${seriesList.map((s, si) => {
      const z = zScores(s.p);
      const xy = s.p.map((v, i) => [(i / (s.p.length - 1)) * (W - 20) + 10, H - pad - ((v - mn) / span) * (H - 2 * pad)]);
      return `<polyline points="${xy.map((p) => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"
                fill="none" stroke="${COL[si] || 'var(--ink3)'}" stroke-width="2.5" stroke-linejoin="round"/>
        ${xy.map((p, i) => isAnomaly(z[i])
          ? `<g><circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="7" fill="none" stroke="${COL[si]||'var(--ink3)'}" stroke-width="2"/>
               <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${COL[si]||'var(--ink3)'}"/>
               <title>Bất thường · Z-score ${z[i].toFixed(2).replace('.',',')} (ngưỡng ${String(CFG.anomaly.z).replace('.',',')}) — ${esc(s.l)}: ${nf(s.p[i])}, kỳ trước trung bình ${nf(Math.round(s.p.slice(0,i).reduce((a,b)=>a+b,0)/i))}</title></g>`
          : `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${COL[si]||'var(--ink3)'}"><title>${esc(s.l)}: ${nf(s.p[i])}</title></circle>`).join('')}`;
    }).join('')}
  </svg>
  <div class="lgd">${seriesList.map((s, i) => `<span><i style="background:${COL[i]||'var(--ink3)'}"></i>${esc(s.l)}</span>`).join('')}</div>`;
}

/* Widget vạn năng. Query dạng `show` được TÍNH lại mỗi lần render nên không
   thể lệch khỏi fixture; dạng `series` đọc chuỗi thời gian đã ghi sẵn. */
function qWidget(q, o) {
  o = o || {};
  if (q.kind === 'series') {
    return `<div class="card flat">
      ${wHead(q.name, q.shown, q.total, q.unit)}
      <div class="cbody">
        ${q.chart === 'anomaly' ? anomalyChart(q.t) : lineChart(q.t)}
        ${axisLbl(q.chart === 'anomaly' ? 'Số bản ghi phản hồi theo kỳ · vòng tròn = vượt ngưỡng Z-score' : 'Giá trị theo kỳ')}
        <div class="note" style="margin-top:11px">${esc(q.note)}</div>
      </div>
    </div>`;
  }
  const r = qRun(q, o.limit);
  const body = q.chart === 'donut'
    ? donut(r.rows, r.total, nf(fx(r.total)), 'bản ghi phản hồi')
    : rankBars(r.rows, { total:r.total, pctMode:q.metric === 'pct', click:o.click, kids:o.kids });
  return `<div class="card flat">
    ${wHead(o.title || q.name, r.shown, r.all, r.unit)}
    <div class="cbody">
      ${body}
      ${axisLbl(r.axis + (r.base === 'ev' ? ' — tập mẫu, không phải toàn bộ bản ghi' : ''))}
      ${q.note ? `<div class="note" style="margin-top:11px">${esc(q.note)}</div>` : ''}
    </div>
  </div>`;
}

/* Tiêu đề section là CÂU HỎI, không phải danh từ — đây là thứ khiến người đọc
   biết mình đang tìm câu trả lời cho cái gì trước khi nhìn vào chart. */
const qSection = (question, sub, body) => `
  <section style="margin-bottom:26px">
    <h2 class="qh">${esc(question)}</h2>
    ${sub ? `<p class="t-meta" style="max-width:92ch;margin:0 0 13px">${sub}</p>` : ''}
    ${body}
  </section>`;

/* ---------- HAI TỔNG QUAN, MỘT BỘ KHUNG ----------
   VoC và CXM là hai PHẦN tách bạch, theo đúng phân định đã chốt từ đầu dự án:
     VoC  — TẠO INSIGHT: tiếng nói tới từ đâu, nói về cái gì, nói ở điểm chạm nào
     CXM  — QUẢN LÝ: điểm gãy, hành động, kết quả đo được, khép vòng với khách
   Hai màn dùng chung renderSet() nhưng KHÔNG phải hai bản sao: chúng đọc hai
   tập dữ liệu khác nhau và trả lời hai loại câu hỏi khác nhau.

   Mỗi phần có nhiều SET. Set là một chuỗi câu hỏi, mỗi câu hỏi có một dãy block.
   Owner thêm/bớt block ngay trong phiên — đó là phần "customize". Không persist
   vì không có backend; refresh là về mặc định, và điều đó được ghi rõ trên UI. */

const SEC = {
  voc: { key:'voc', label:'Voice of Customer',
         lead:() => `${nf(fx(scopeTotal()))} bản ghi phản hồi từ ${scopeSources().length} nguồn, ${DATA.sources.filter((s) => sourceHealth(s) !== 'ok').length} nguồn đang có vấn đề.`,
         intro:'Phần này <b>tạo insight</b>: khách đang nói gì, tiếng nói tới từ đâu, và nó rơi vào điểm chạm nào. Việc xử lý nằm ở phần CXM.' },
  cxm: { key:'cxm', label:'CXM · Quản trị trải nghiệm',
         lead:() => { const open = DATA.iss.filter((i) => action(i.act) && action(i.act).lc !== 'closed').length;
                      const pend = ACT.filter((a) => a.ap === 'pending').length;
                      return `${open} điểm gãy chưa khép vòng, ${pend} hành động đang chờ người có thẩm quyền duyệt.`; },
         intro:'Phần này <b>quản lý việc xử lý</b>: điểm gãy, người phụ trách, phê duyệt, kết quả đo được và khép vòng với khách. Insight đến từ phần VoC.' },
};

/* Khối đặc biệt — thứ cần vẽ không phải một chart đơn. Mỗi khối tự khai báo nó
   thuộc phần nào và dẫn tới tab chi tiết nào. */
const BLOCKS = {
  '@srcmatrix':   { n:'Độ toàn vẹn nguồn', sec:'voc', go:'sources' },
  '@intent':      { n:'Bốn khối theo intent', sec:'voc', go:'topics', wide:true },
  '@anomlanes':   { n:'Ba làn bất thường', sec:'voc', go:'agents' },
  '@toppri':      { n:'Quantified Top — bốn cách xếp', sec:'cxm', go:'work', wide:true },
  '@journeystate':{ n:'Trạng thái hành trình', sec:'cxm', go:'atlas', wide:true },
  '@coverage':    { n:'Độ phủ đo lường', sec:'cxm', go:'atlas' },
  '@lanes':       { n:'Bốn làn công việc', sec:'cxm', go:'work', wide:true },
  '@outcomes':    { n:'Kết quả đo được', sec:'cxm', go:'work', wide:true },
};

function blockBody(k) {
  if (k === '@srcmatrix') {
    const bad = DATA.sources.filter((s) => sourceHealth(s) !== 'ok');
    return `<div class="card flat">
      ${wHead('Độ toàn vẹn nguồn', DATA.sources.length, DATA.sources.length, 'nguồn')}
      <div class="cbody">${srcMatrix(true)}
        ${axisLbl('Nguồn × nền tảng · trạng thái so với SLA riêng từng nguồn')}
        <div class="note ${bad.length ? 'crit' : ''}" style="margin-top:11px">${bad.length
          ? `<b>${bad.length} nguồn đang có vấn đề.</b> ${esc(bad.map((s) => s.name).join(' · '))} — kéo theo ${[...new Set(bad.flatMap((s) => s.metrics))].length} chỉ số bị sai. <a href="#/sources">Xem hồ sơ từng nguồn</a>`
          : 'Mọi nguồn đang trong SLA.'}</div>
      </div></div>`;
  }

  if (k === '@intent') {
    const CATQ = [['complaint','Khách đang bức xúc về điều gì?'], ['improvement','Khách muốn cải thiện điều gì?'],
                  ['help','Khách đang cần giúp ở đâu?'], ['praise','Khách thích điều gì?']];
    return `<div class="grid g2">${CATQ.map((cq) => {
      const c = cq[0], label = cq[1];
      const rows = taxLv('theme').filter((t) => t.cat === c).sort((a, b) => b.n - a.n);
      return `<div class="card flat">
        ${wHead(label, Math.min(rows.length, 6), rows.length, 'theme')}
        <div class="cbody">
          ${rows.length ? rankBars(rows.slice(0, 6).map((t) => ({ id:t.id, l:t.name, v:t.n, c:DATA.cats[c].color })), {
            total:rows.reduce((a, t) => a + t.n, 0),
            click:(r) => `drillTopic('${r.id}')`,
            kids:(r) => DATA.tax.filter((x) => x.lv === 'subtheme' && x.p === r.id),
          }) : '<div class="empty">Chưa có theme nào thuộc nhóm này.</div>'}
          ${axisLbl('Số bản ghi phản hồi')}
        </div></div>`;
    }).join('')}</div>`;
  }

  if (k === '@anomlanes') {
    const n = DATA.ag.reduce((a, g) => a + g.f.filter((f) => f.lane).length, 0);
    return `<div class="card flat">${wHead('Ba làn bất thường', n, n, 'cảnh báo')}
      <div class="cbody" style="padding-top:6px">${anomalyLanes()}</div></div>`;
  }

  if (k === '@toppri') {
    const open = DATA.iss.filter((i) => action(i.act) && action(i.act).lc !== 'closed');
    const by = (fn) => open.slice().sort((a, b) => fn(b) - fn(a))
      .map((i) => ({ id:i.id, l:i.title, v:fn(i), c:i.sev === 'critical' ? 'var(--crit)' : i.sev === 'high' ? 'var(--watch)' : 'var(--ink3)' }));
    return `<div class="grid g4">
      ${topCard('Top theo số khách ảnh hưởng', by((i) => i.imp.aff), 'khách bị ảnh hưởng', null)}
      ${topCard('Top theo khách giá trị cao', by((i) => i.imp.hv), 'khách high-value', 'Thay cho Sum(LTV) — fixture không có trường LTV, bịa số tiền là tạo niềm tin sai.')}
      ${topCard('Top theo tác động CES', by((i) => Math.abs(i.imp.csat) * 10), 'điểm CES × 10', 'Thay cho Impact on NPS — khảo sát NPS đang tạm dừng, CES thì đang chạy với n=612.')}
      ${topCard('Top theo rủi ro tuân thủ', by((i) => i.pri.reg), 'điểm rủi ro pháp lý', 'Không có trong mô hình VoC cho app tiêu dùng. Một lỗi eKYC có hệ quả tuân thủ khác hẳn một lỗi giao diện, dù cùng số khách.')}
    </div>`;
  }

  if (k === '@journeystate') {
    const sts = DATA.steps, cnt = (s) => sts.filter((x) => stepState(obs(x.id)) === s).length;
    const worst = sts.slice().sort((a, b) => obs(b.id).failed - obs(a.id).failed)[0];
    const wo = obs(worst.id);
    return `<div class="card flat">
      ${wHead('Trạng thái hành trình', DATA.flows.filter((f) => f.observed).length, DATA.flows.length, 'flow có dữ liệu quan sát')}
      <div class="cbody">
        <div class="stats" style="margin:0 0 14px">
          ${stat('Cần xử lý ngay', String(cnt('crit')), 'bước vượt ngưỡng xử lý', 'stepState() · ngưỡng ở Chỉ số & ngưỡng', cnt('crit') ? 'var(--crit)' : null)}
          ${stat('Cần theo dõi', String(cnt('watch')), 'bước vượt ngưỡng theo dõi', 'gồm cả bước thiếu evidence coverage', cnt('watch') ? 'var(--watch)' : null)}
          ${stat('Đang kiểm soát', String(cnt('ok')), 'bước trong ngưỡng', 'không có nghĩa là không có tiếng nói — xem VoC theo hành trình')}
          ${stat('Flow chưa đo', String(DATA.flows.length - DATA.flows.filter((f) => f.observed).length), 'trên ' + DATA.flows.length + ' flow đã map', 'chủ ý, không phải mất dữ liệu')}
        </div>
        <div class="fchips" style="margin-bottom:12px">${sts.map((s) => {
          const o = obs(s.id), st = stepState(o);
          const col = st === 'crit' ? 'var(--crit)' : st === 'watch' ? 'var(--watch)' : 'var(--ink3)';
          return `<button onclick="go('atlas')" title="${esc(stepWhy(o))}" style="border-color:${st === 'ok' ? 'var(--line)' : col}">
            ${s.code} ${esc(s.name)} <b class="mono" style="color:${col}">${pv(o.failed, o.entered)}%</b></button>`;
        }).join('')}</div>
        ${axisLbl('Tỷ lệ thất bại từng bước · chỉ pilot Mở tài khoản có dữ liệu quan sát')}
        <div class="note ${stepState(wo) === 'crit' ? 'crit' : ''}" style="margin-top:11px">
          Nặng nhất là bước <b>${worst.code} ${esc(worst.name)}</b>: ${nf(fx(wo.failed))} lượt thất bại, ${pv(wo.failed, wo.entered)}% người vào bước này.
          <a href="#/atlas">Mở bản đồ hành trình</a> để xem khách rơi ở đâu giữa các bước.
        </div>
      </div></div>`;
  }

  if (k === '@coverage') {
    const gaps = DATA.signals.filter((g) => g.st === 'gap' || g.st === 'designed');
    const low = DATA.steps.filter((s) => obs(s.id).cov < CFG.step.covMin);
    return `<div class="card flat">
      ${wHead('Độ phủ đo lường', DATA.flows.filter((f) => f.verified).length, DATA.flows.length, 'flow có nguồn xác minh')}
      <div class="cbody">
        ${rankBars(DATA.steps.map((s) => ({ id:s.id, l:s.code + ' ' + s.name, v:obs(s.id).cov,
          c:obs(s.id).cov < CFG.step.covMin ? 'var(--watch)' : 'var(--ink3)' })), { total:600, click:() => `go('atlas')` })}
        ${axisLbl('Evidence coverage từng bước, đơn vị %')}
        <div class="note ${low.length ? 'warn' : ''}" style="margin-top:11px">${low.length
          ? `Bước ${low.map((s) => s.code).join(' và ')} dưới ngưỡng ${CFG.step.covMin}% — nghĩa là kể cả khi thấy thất bại, ta vẫn <b>không biết lý do</b> của phần lớn trường hợp.`
          : `Mọi bước đạt ngưỡng ${CFG.step.covMin}%.`}
          ${gaps.length ? ` Còn <b>${gaps.length} signal</b> chưa instrument hoặc mới có spec.` : ''}</div>
      </div></div>`;
  }

  if (k === '@lanes') {
    return `<div class="card flat">
      ${wHead('Bốn làn công việc', ACT.filter((a) => laneOf(a) !== 'off').length, ACT.length, 'việc còn cần tay người')}
      <div class="cbody"><div class="grid g4">${LANES.map((L) => {
        const list = ACT.filter((a) => laneOf(a) === L.k).sort((x, y) => iss(y.iss).pri.total - iss(x.iss).pri.total);
        const hot = L.k === 'assign' && list.length;
        return `<button class="card flat" style="text-align:left;padding:13px;cursor:pointer;${hot ? 'border-color:var(--crit)' : ''}"
                onclick="setSub('work','lanes');go('work')">
          <div class="t-lbl">${L.n} · ${esc(L.l)}</div>
          <div class="t-num" style="font-size:26px;margin:4px 0 2px;${hot ? 'color:var(--crit)' : ''}">${list.length}</div>
          <div class="t-meta" style="font-size:11.5px">${esc(L.sub)}</div>
          ${list.length ? `<div class="t-meta" style="font-size:11.5px;margin-top:7px;border-top:1px dashed var(--line);padding-top:6px">Ưu tiên cao nhất: <b>${esc(iss(list[0].iss).title)}</b></div>` : ''}
        </button>`;
      }).join('')}</div>
      ${axisLbl('Số hành động trong mỗi làn · làn suy ra từ owner / duyệt / triển khai / đánh giá')}
      </div></div>`;
  }

  if (k === '@outcomes') {
    const done = DATA.out.length, acts = ACT.filter((a) => a.dl === 'released').length;
    return `<div class="card flat">
      ${wHead('Kết quả đo được', done, acts, 'thay đổi đã phát hành')}
      <div class="cbody">
        ${DATA.out.map((o) => {
          const a = action(o.act);
          const lbl = o.verdict === 'improved' ? 'Đã cải thiện' : o.verdict === 'worse' ? 'Xấu đi' : 'Chưa kết luận được';
          const up = o.post.v - o.base.v;
          return `<div class="note ${o.verdict === 'improved' ? 'bd' : o.conf.length ? 'warn' : ''}" style="margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px">
              <span class="mono" style="color:var(--ink3)">${esc(o.act)}</span>
              <b>${esc(a ? a.title : o.act)}</b>
              ${badge(o.verdict === 'improved' ? 'ok' : 'unknown', lbl)}
            </div>
            <div class="t-meta">${String(o.base.v).replace('.', ',')}${o.base.u} → <b style="color:${up > 0 ? 'var(--good)' : 'var(--crit)'}">${String(o.post.v).replace('.', ',')}${o.post.u}</b>
              · cohort ${esc(o.cohort)} · ${esc(o.win)}</div>
            ${o.conf.length ? `<div class="t-meta" style="font-size:12px;margin-top:6px;color:var(--crit)">⚠ ${o.conf.length} yếu tố nhiễu chưa loại trừ: ${o.conf.map((c) => esc(c)).join(' · ')}</div>` : ''}
          </div>`;
        }).join('')}
        ${axisLbl('Chỉ tính thay đổi đã phát hành và đã có đủ kỳ quan sát')}
        <div class="note" style="margin-top:11px">${acts - done} thay đổi đã phát hành nhưng <b>chưa có kết quả đo</b> — hoặc chưa đủ kỳ quan sát, hoặc nguồn dùng để đo đang hỏng.
          Khép vòng với khách: ${DATA.loop.filter((l) => l.done >= l.need).length}/${DATA.loop.length} điểm gãy đã liên hệ đủ. <a href="#/work">Mở bảng xử lý</a></div>
      </div></div>`;
  }
  return `<div class="note crit">Khối "${esc(k)}" không tồn tại.</div>`;
}

/* Danh sách block hiện tại của một câu hỏi — đọc bản đã tùy chỉnh nếu có */
const curB = (d, qi) => (ST.boards[d.id] ? ST.boards[d.id][qi] : d.qs[qi].b);
const blkName = (b) => (b[0] === '@' ? BLOCKS[b].n : qt(b) ? qt(b).name : b);

/* Chart nào dẫn tới tab nào — luôn trong phần của chính nó */
function blkClick(id) {
  const q = qt(id);
  if (!q || q.kind !== 'show') return null;
  if (['l1','l2','l3'].indexOf(q.show) > -1) return (r) => `drillVoc('${r.id}')`;
  if (['theme','sub'].indexOf(q.show) > -1)  return (r) => `drillTopic('${r.id}')`;
  if (q.show === 'src')                      return (r) => `drillSource('${r.id}')`;
  return null;
}

  return `<div class="wrap">
    <div class="hero">
      <div class="kick">${esc(S.label)} · ${esc(period().label)} · ${esc(period().range)}</div>

    <p class="t-body" style="max-width:92ch;margin:0 0 6px;color:var(--ink2)">${esc(cur.desc)}</p>
    ${custom ? `<div class="note warn" style="margin:10px 0 16px">Set này đang có thay đổi. Cấu hình <b>không persist</b> — refresh browser là về mặc định, vì prototype không có backend.

        ${qq.sub ? `<p class="t-meta" style="max-width:92ch;margin:0 0 13px">${qq.sub}</p>` : ''}
        ${bs.length ? `<div class="blks">${bs.map((b) => {

          const body = b[0] === '@' ? blockBody(b) : qWidget(qt(b), { click:blkClick(b) });
          return `<div class="blk ${wide ? 'wide' : ''}" data-tour="blk-${b}">

          <select onchange="if(this.value)blkAdd('${cur.id}',${qi},this.value)"

/* Ba làn bất thường. Phân loại theo BẢN CHẤT của cái bất thường, không theo agent
   nào phát hiện ra nó — người đọc cần biết "đây là khách nói khác đi" hay
   "đây là ống dẫn dữ liệu hỏng", hai thứ dẫn tới hai hành động khác nhau. */
function anomalyLanes() {
  /* Làn lấy từ trường `lane` khai báo tường minh trên từng finding, KHÔNG đoán
     từ tiêu đề. Bản đầu tôi phân loại bằng regex và nó gán nhầm ngay finding
     quan trọng nhất — "Volume lỗi liveness vượt baseline" khớp chữ "volume" nên
     rơi vào làn phản hồi, khiến làn hành vi trống rỗng. */
  const LANE = [
    ['voice',     'Trong phản hồi',         'Khách nói khác đi so với baseline'],
    ['behaviour', 'Trong hành vi',          'Event hệ thống lệch baseline'],
    ['pipeline',  'Của chính nguồn dữ liệu','Ống dẫn hỏng — số tụt vì mất nguồn, không phải vì đã sửa xong'],
  ];
  const all = DATA.ag.flatMap((g) => g.f.map((f) => ({ ...f, ag:g.name })));
  return LANE.map(([key, name, desc]) => {
    const hits = all.filter((f) => f.lane === key);
    return `<div style="margin-bottom:13px">
      <div class="t-lbl">${esc(name)} <b class="mono">${hits.length}</b></div>
      <div class="t-meta" style="font-size:12px;margin:3px 0 7px">${esc(desc)}</div>
      ${hits.length ? hits.map((f) => `<div class="note ${f.sev === 'critical' ? 'crit' : f.sev === 'high' ? 'warn' : ''}" style="margin-bottom:6px">
        <b>${esc(f.title)}</b> <span class="t-meta">· ${esc(f.at)} · ${esc(f.ag)}</span>
        <div style="margin-top:4px">${esc(f.detail)}</div>
      </div>`).join('') : '<div class="t-meta" style="font-size:12px">Không có cảnh báo trong làn này.</div>'}
    </div>`;
  }).join('') + (() => {
    const none = DATA.ag.flatMap((g) => g.f).filter((f) => f.lane === null);
    return `${none.length ? `<div class="t-meta" style="font-size:12px;margin-bottom:6px">${none.length} mục không phải bất thường (bản tin định kỳ) nên không nằm trong ba làn — xem ở <a href="#/agents">Agent &amp; cảnh báo</a>.</div>` : ''}
    <div class="t-meta" style="font-size:12px">Ngưỡng và người nhận cảnh báo đặt ở <a href="#/rules">Chỉ số &amp; ngưỡng</a> · chi tiết agent ở <a href="#/agents">Agent &amp; cảnh báo</a>.</div>`;
  })();
}

/* ---------- Quantify = query builder trên tập hữu hạn ----------

   để không tạo kỳ vọng sai về năng lực". Lý do đó vẫn đúng nhưng cách giải thì
   sai: nó biến một chức năng lõi thành ảnh chụp màn hình.

   Ở đây có builder thật, nhưng MỌI Ô LÀ DROPDOWN trên tập giá trị liệt kê sẵn.
   Không nhập tự do, không join tùy ý, không tính toán phái sinh. Người dùng nhìn

    <p class="t-meta" style="max-width:88ch;margin:0 0 18px">Mọi ô là danh sách đóng, không có ô nhập tự do. Đây là chủ ý: người dùng thấy được toàn bộ giới hạn của công cụ ngay từ đầu. Chart dựng ra <b>tính từ fixture mỗi lần render</b>, nên không thể lệch khỏi dữ liệu như bản hardcode trước đây.</p>

    <div class="split" style="grid-template-columns:320px minmax(0,1fr)">
      <div>
        <div class="card" style="align-self:start;margin-bottom:14px">
          ${chead('Dựng chart', 'Ba lựa chọn, không có ô nhập tự do')}
          <div class="cbody">
            ${pick(['show','Show me · chiều phân tích'], Object.entries(DIMS).map(([k, d]) => [k, d.label]), b.show)}
            ${pick(['metric','Chỉ số'], Object.entries(METRICS).map(([k, m]) => [k, m.label]), b.metric)}
            ${pick(['chart','Kiểu chart'], [['rank', CHARTS.rank], ['donut', CHARTS.donut]], b.chart)}
            <div class="hr"></div>

            <div class="t-meta" style="font-size:12px">Đang dùng bộ lọc kỳ ở thanh trên: <b>${esc(period().label)}</b> (${esc(period().range)}). Enterpret có thêm Since và Between — ở đây rút gọn còn ba kỳ có sẵn trong fixture.</div>
            <div class="hr"></div>
            <div class="t-lbl" style="margin-bottom:5px">So sánh</div>
            <div class="t-meta" style="font-size:12px">So sánh theo thời gian và theo filter khác nằm trong bốn tổ hợp chuỗi đã lưu ở cột phải — chuỗi thời gian không suy ra được từ số tổng hợp nên không dựng động được.</div>
          </div>
        </div>
        <div class="card" style="align-self:start">
          ${chead('Đã lưu', 'Bấm để mở', DATA.qt.length, DATA.qt.length, 'Quantify')}
          <div class="lst">${DATA.qt.map((q) => `

        ${ST.sel.quantify ? `<div style="margin-top:14px">${qWidget(qt(ST.sel.quantify))}</div>` : ''}
