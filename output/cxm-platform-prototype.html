};

/* ---------- VoC theo hành trình ----------
   Cùng điều hướng ba nhịp với #/atlas, nhưng đo thứ khác:
     #/atlas       — HÀNH VI: bao nhiêu người vào, hoàn tất, rơi
     #/vocjourney  — TIẾNG NÓI: khách nói gì ở đó, sentiment ra sao
   Đặt cạnh nhau mới lộ ra thứ không màn nào thấy một mình: bước 05 Ký hợp đồng
   chỉ rơi 6% nên hành vi trông ổn, nhưng 295 phản hồi "không rõ trạng thái" dồn
   vào đúng đó. Hành vi im lặng, tiếng nói thì không. */
V.vocjourney = () => {
  const pid = ST.sel.vocPhase || 'p2';
  const ph = phase(pid);
  const gs = DATA.groups.filter((g) => g.phaseId === pid);
  const fls = DATA.flows.filter((f) => gs.some((g) => g.id === f.groupId));
  const fid = ST.sel.vocFlow && fls.some((f) => f.id === ST.sel.vocFlow) ? ST.sel.vocFlow : (fls[0] && fls[0].id);
  const fl = fid && flow(fid);
  const sts = fid ? DATA.steps.filter((s) => s.flowId === fid) : [];
  const sid = sts.some((s) => s.id === ST.sel.vocStep) ? ST.sel.vocStep : (sts[0] && sts[0].id);

  /* Node taxonomy gắn với một điểm chạm — đây là thứ nối hai lớp lại với nhau */
  const nodesFor = (target) => DATA.tax.filter((t) => t.maps === target);
  const phN = taxLv('L1').find((t) => t.maps === pid);
  const evOf = (stepId) => DATA.ev.filter((e) => e.step === stepId);
  const themesAt = (stepId) => {
    const m = {};
    evOf(stepId).forEach((e) => e.tax.map((t) => tax(t)).filter((t) => t && t.lv === 'theme')
      .forEach((t) => { m[t.id] = (m[t.id] || 0) + 1; }));
    return Object.entries(m).map(([id, c]) => ({ n:tax(id), c })).sort((a, b) => b.c - a.c);
  };
  const senAt = (stepId) => { const l = evOf(stepId); return l.length ? l.reduce((a, e) => a + e.sen, 0) / l.length : null; };

  return `<div class="wrap">
    <h1 class="t-hero" style="max-width:40ch;margin-bottom:8px">Bản đồ hành trình đo <i>hành vi</i>. Màn này đo <i>tiếng nói</i> tại cùng những điểm chạm đó.</h1>
    <p class="t-meta" style="max-width:92ch;margin:0 0 16px">Cùng ba nhịp điều hướng với <a href="#/atlas">Bản đồ hành trình</a>: chọn phase, chọn flow, đọc chuỗi điểm chạm. Khác ở chỗ mỗi điểm chạm hiện <b>khách nói gì</b> chứ không phải bao nhiêu người rơi. Hai lớp đặt cạnh nhau mới thấy được chỗ hành vi im lặng mà tiếng nói thì không.</p>

    ${(() => { const n = tax(ST.sel.vocTax); if (!n) return '';
      return `<div class="note bd" style="margin-bottom:14px">Bạn vừa mở từ node <b>${esc(n.name)}</b> (${esc(n.lv === 'subtheme' ? 'sub-theme' : n.lv)}${n.maps ? '' : ', chưa gắn điểm chạm nào nên màn mở ở vị trí mặc định'}).
        <button class="disc" style="margin-left:8px" onclick="setSel('vocTax',null)">bỏ đánh dấu</button>
        <button class="disc" style="margin-left:8px" onclick="setTax('${n.id}');go('topics')">xem node trong Topic VoC →</button></div>`;
    })()}

    <div class="prail">${DATA.phases.map((p) => {
      const n = taxLv('L1').find((t) => t.maps === p.id);
      const cnt = DATA.groups.filter((g) => g.phaseId === p.id).length;
      return `<button class="${p.id === pid ? 'on' : ''}" onclick="setVoc('Phase','${p.id}')" title="${esc(p.name)}">
        <div class="pc">${p.code}</div>
        <div class="pn">${esc(p.name)}</div>
        <div class="pd"><span>${n ? nf(fx(n.n)) + ' phản hồi' : 'chưa gán'} · ${cnt} nhóm</span></div>
      </button>`;
    }).join('')}</div>

    <div class="card" style="margin-bottom:14px">
      ${chead(ph.code + ' · ' + ph.name, phN ? `${nf(fx(phN.n))} bản ghi phản hồi gán vào phase này` : 'Chưa có node taxonomy nào gắn với phase này',
        fls.length, DATA.flows.length, 'flow')}
      <div class="cbody tight" style="padding:13px 15px">
        <div class="frail">${gs.map((g) => {
          const gn = nodesFor(g.id);
          return `<div>
            <div class="t-lbl" style="margin-bottom:6px">${esc(g.name)}${gn.length ? ` · <b class="mono">${nf(fx(gn.reduce((a, t) => a + t.n, 0)))}</b>` : ''}</div>
            <div class="fchips">${DATA.flows.filter((f) => f.groupId === g.id).map((f) => {
              const fn = nodesFor(f.id);
              return `<button class="${f.id === fid ? 'on' : ''}" onclick="setVoc('Flow','${f.id}')">
                ${esc(f.name)}${fn.length ? ` <b class="mono">${nf(fx(fn.reduce((a, t) => a + t.n, 0)))}</b>` : ''}</button>`;
            }).join('')}</div>
          </div>`;
        }).join('')}</div>
      </div>
    </div>

    ${!fl ? '' : `<div class="card" style="margin-bottom:14px">
      ${chead(fl.name, sts.length ? 'Chuỗi điểm chạm — mỗi thẻ hiện tiếng nói tại đó' : 'Flow này chưa nằm trong pilot', sts.length, sts.length, 'điểm chạm')}
      <div class="cbody">${sts.length ? `<div class="spine" data-tour="voc-spine">${sts.map((s) => {
        const th = themesAt(s.id), sen = senAt(s.id), n = evOf(s.id).length;
        const top = th[0];
        return `<button class="sn ${sen === null ? '' : sen < -0.5 ? 'crit' : sen < 0 ? 'watch' : 'ok'} ${s.id === sid ? 'on' : ''}"
                onclick="setVoc('Step','${s.id}')" style="min-width:170px">
          <div class="sc">${s.code} · ${esc(s.stationId)}</div>
          <div class="snm">${esc(s.name)}</div>
          <div class="sv">${n}</div>
          <div class="sl">bằng chứng mẫu</div>
          <div class="sl" style="margin-top:7px">Sentiment <b class="num" style="color:${sen === null ? 'var(--ink3)' : sen < 0 ? 'var(--crit)' : 'var(--good)'}">${sen === null ? '—' : (sen > 0 ? '+' : '') + sen.toFixed(1).replace('.', ',')}</b></div>
          <div class="sl">${top ? esc(top.n.name) : 'chưa có topic'}</div>
        </button>`;
      }).join('')}</div>
      <div class="note" style="margin-top:14px"><b>Đối chiếu hai lớp:</b> ${(() => {
        const quiet = sts.filter((s) => obs(s.id) && failRate(obs(s.id)) < CFG.step.failWatch && evOf(s.id).length);
        return quiet.length
          ? `bước ${quiet.map((s) => s.code).join(' và ')} có tỷ lệ rơi <b>dưới ngưỡng theo dõi</b> nên trên bản đồ hành trình trông ổn — nhưng vẫn có phản hồi dồn vào đó. Hành vi im lặng không có nghĩa là không có vấn đề.`
          : `mọi bước có tiếng nói đều đã vượt ngưỡng theo dõi trên bản đồ hành trình — hai lớp đang nói cùng một điều.`;
      })()} Xem lớp hành vi ở <a href="#/atlas">Bản đồ hành trình</a>.</div>`
      : `<div class="note warn">${badge('unknown')} <b>Chưa có phản hồi gán vào flow này.</b> Flow đã map ở mức cấu trúc nhưng chưa nằm trong pilot nên chưa có điểm chạm nào được instrument. Đây là chủ ý, không phải mất dữ liệu.
        <div style="margin-top:8px">${nodesFor(fid).length ? `Có ${nodesFor(fid).length} node taxonomy trỏ tới flow này (${nodesFor(fid).map((t) => esc(t.name)).join(' · ')}) nhưng chưa xuống được tới mức điểm chạm.` : 'Chưa node taxonomy nào trỏ tới flow này.'}</div></div>`}
      </div>
    </div>`}

    ${sid ? vocInspector(sid) : ''}
  </div>`;
};

/* Hồ sơ một điểm chạm, ba tab — song song với stepInspector của bản đồ hành trình */
function vocInspector(sid) {
  const s = step(sid), tab = ST.sub.vocTab || 'topic';
  const TABS = [['topic','Topic tại điểm chạm'], ['verb','Verbatim'], ['ins','Insight & đề xuất']];
  const evs = DATA.ev.filter((e) => e.step === sid);
  const ins = DATA.ins.filter((i) => i.step === sid);
  const m = {};
  evs.forEach((e) => e.tax.map((t) => tax(t)).filter((t) => t && (t.lv === 'theme' || t.lv === 'subtheme'))
    .forEach((t) => { m[t.id] = (m[t.id] || 0) + 1; }));
  const rows = Object.entries(m).map(([id, c]) => ({ t:tax(id), c })).sort((a, b) => b.c - a.c);
  const cats = Object.keys(DATA.cats).map((k) => ({ id:k, l:DATA.cats[k].label, c:DATA.cats[k].color, v:evs.filter((e) => e.cat === k).length })).filter((x) => x.v);

  return `<div class="card" data-tour="voc-inspector">
    ${chead('Điểm chạm ' + s.code + ' · ' + s.name, esc(s.stationId) + ' · phụ trách ' + esc(s.owner), evs.length, DATA.ev.length, 'bằng chứng mẫu')}
    <div class="tabs">${TABS.map(([k, l]) => `<button class="${tab===k?'on':''}" onclick="setSub('vocTab','${k}')">${l}</button>`).join('')}</div>
    <div class="cbody">
      ${tab === 'topic' ? (rows.length ? `
        <div class="grid g2">
          <div>
            <div class="t-lbl" style="margin-bottom:8px">Topic và sắc thái tại điểm chạm này</div>
            ${rankBars(rows.map((r) => ({ id:r.t.id, l:(r.t.lv === 'subtheme' ? '↳ ' : '') + r.t.name, v:r.c })), { click:(x) => `drillFeed('theme','${x.id}')` })}
            ${axisLbl('Số bằng chứng mẫu — tập mẫu, không phải toàn bộ bản ghi')}
          </div>
          <div>
            <div class="t-lbl" style="margin-bottom:8px">Intent của khách tại đây</div>
            ${rankBars(cats, { click:(x) => `drillFeed('cat','${x.id}')` })}
            ${axisLbl('Số bằng chứng mẫu')}
            <div class="note" style="margin-top:12px">Volume tổng hợp của từng topic nằm ở <a href="#/topics">Topic VoC</a>; ở đây là số bằng chứng mẫu thực sự gắn vào đúng điểm chạm này.</div>
          </div>
        </div>` : `<div class="note">${badge('unknown')} Chưa có bằng chứng mẫu nào gán vào điểm chạm này.</div>`) : ''}

      ${tab === 'verb' ? (evs.length ? `<div style="display:grid;gap:11px">${evs.map((e) => `
        <div class="quote">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap">
            ${catChip(e.cat)}<span class="chip">${esc(src(e.src).name)}</span><span class="chip">${PF_LABEL[e.pf] || e.pf}</span>
            <span class="mono" style="font-size:12px;color:var(--ink3)">${esc(e.ref)}</span>
            <div class="grow"></div><span class="t-meta">${esc(e.at)}</span>
          </div>
          <p>“${esc(e.q)}”</p>
          <div class="qm"><span>🔒 ${esc(e.ck)}</span><span class="mono">${taxPathAll(e.tax)}</span></div>
        </div>`).join('')}
        <button class="btn sm" style="justify-content:center" onclick="drillFeed('step','${sid}')">Mở toàn bộ trong Feed →</button>
        </div>` : `<div class="note">${badge('unknown')} Chưa có verbatim nào tại điểm chạm này.</div>`) : ''}

      ${tab === 'ins' ? (ins.length ? ins.map((i) => `
        <div class="note" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px">
            <span class="mono" style="color:var(--ink3)">${i.id}</span>
            <b>${esc(tax(i.theme).name)}</b>
            <span class="chip">${nf(fx(i.n))} phản hồi</span>
            <span class="chip">${i.pos}% tích cực</span>
            <span class="chip" style="color:${i.trend < 0 ? 'var(--crit)' : 'var(--good)'};border-color:currentColor">${i.trend > 0 ? '+' : ''}${i.trend} điểm</span>
          </div>
          <div style="margin-bottom:8px">${esc(i.rec)}</div>
          <div class="t-meta" style="font-size:12px">
            ${i.hoEl
              ? `✓ Đủ điều kiện đẩy thành CX issue — ${esc(i.hoWhy)}${i.hoIssue ? ` · đã tạo <a href="#/issue/${i.hoIssue}">${i.hoIssue}</a>` : ''}`
              : `⚠ Chưa đủ điều kiện — ${esc(i.hoWhy)}`}
          </div>
        </div>`).join('') : `<div class="note">${badge('unknown')} Chưa có insight nào cho điểm chạm này.</div>`) : ''}
    </div>
  </div>`;
}

/* ---------- Hàng đợi ưu tiên ----------
   TRƯỚC ĐÂY là nửa dưới của #/health. Nửa trên — funnel pilot 6 bước — ĐÃ BỎ vì
   nó trùng hoàn toàn với journeySpine() ở #/atlas: cùng DATA.steps, cùng DATA.obs,
   cùng stepState(), cùng thanh evidence coverage. journeySpine() còn có thêm dải
   nối thể hiện số khách rơi giữa hai bước, nên nó là bản đầy đủ hơn.

   Nửa này thì KHÔNG có ở đâu khác: xếp hạng điểm gãy XUYÊN BƯỚC kèm breakdown 6
   thành phần ưu tiên. stepInspector chỉ liệt kê issue của một bước; các làn của
   #/work chia theo trạng thái xử lý, không theo mức ưu tiên. Nên nó được giữ và
   chuyển thành một chế độ xem của #/work. */
function frictionQueue() {
  const open = DATA.iss.filter((i) => action(i.act) && action(i.act).lc !== 'closed')
    .sort((a, b) => b.pri.total - a.pri.total);
  return `<div class="card">
      ${chead('Xếp theo mức ưu tiên', 'Xuyên bước, xuyên flow. Mở breakdown để kiểm tra vì sao một điểm gãy đứng đầu.', open.length, DATA.iss.length, 'điểm gãy')}
      <table>
        <thead><tr><th>Điểm gãy</th><th>Bước</th><th>Mức</th><th>Khách ảnh hưởng</th><th>Repeat</th><th>Tin cậy</th><th>Ưu tiên</th><th></th></tr></thead>
        <tbody>${open.map((i) => {
          const s = step(i.step), showB = ST.sel['pri-' + i.id];
          return `<tr class="clickable" onclick="go('issue/${i.id}')">
              <td><div class="mono" style="font-size:12px;color:var(--ink3)">${i.id}</div><div class="t-item" style="font-size:14px;margin-top:2px">${esc(i.title)}</div></td>
              <td class="t-meta">${s.code} · ${esc(s.name)}</td>
              <td>${badge(SEV[i.sev], SEV_LABEL[i.sev])}</td>
              <td><b class="num">${nf(fx(i.imp.aff))}</b></td>
              <td><b class="num">${i.imp.rep}%</b></td>
              <td><b class="num">${i.conf}%</b></td>
              <td><b class="num" style="font-size:17px">${i.pri.total}</b></td>
              <td><button class="disc" onclick="event.stopPropagation();tog('pri-${i.id}')">${showB?'Ẩn ▴':'Vì sao ▾'}</button></td>
            </tr>
            ${showB ? `<tr><td colspan="8" style="background:var(--surface2)">
              <div class="t-lbl" style="margin-bottom:9px">Breakdown điểm ưu tiên — tổng ${i.pri.total}</div>
              ${barChart([
                {l:'Mức nghiêm trọng', v:i.pri.sev, c:'var(--crit)'},
                {l:'Số khách bị ảnh hưởng (unique)', v:i.pri.aff, c:'var(--watch)'},
                {l:'Mức quan trọng của bước trong hành trình', v:i.pri.jc, c:'var(--ink3)'},
                {l:'Liên hệ lặp lại', v:i.pri.rep, c:'var(--ink3)'},
                {l:'Xu hướng', v:i.pri.tr, c:'var(--ink3)'},
                {l:'Rủi ro pháp lý / tuân thủ', v:i.pri.reg, c:'var(--primary)'},
              ], false)}
              <div class="note" style="margin-top:11px">Rủi ro pháp lý là thành phần đặc thù ngành chứng khoán — một lỗi eKYC có hệ quả tuân thủ khác một lỗi giao diện, dù cùng số khách bị ảnh hưởng.</div>
            </td></tr>` : ''}`;
        }).join('')}</tbody>
      </table>
    </div>`;
}

/* ---------- Bảng xử lý (#/work) ----------
   MỘT surface cho cả vòng đời, thay 3 route Điểm gãy / Hành động / Kết quả.
   4 làn = việc còn cần tay người. Cố ý KHÔNG có làn thứ 5 "đã xong": việc đã
   verify rời board xuống khối Khép vòng, việc đã khép chỉ còn trong chip
   "Đã xong" — phải chủ động mở mới thấy, để board không biến thành kho lưu trữ.
   Làn suy ra từ state đang có (owner / ap / dl / iv), không thêm field mới. */
const UNASSIGNED  = 'Chưa gán';
const OWNERS      = ['Minh Quân','Linh Trần','Hà Vũ','Thu Hà','Đức Anh','Ngọc Mai'];
const APPROVERS   = ['Head of Onboarding','Head of Growth','Head of CX','Head of Risk','Data Platform Lead'];
const ST_ISS      = { detecting:'Mới phát hiện', investigating:'Đang điều tra', fixing:'Đang sửa', resolved:'Đã xác nhận' };

const LANES = [
  { k:'assign',  n:'1', l:'Cần gán người',
    sub:'Đã ghi nhận nhưng chưa ai chịu trách nhiệm. Đứng ở đây càng lâu càng khó biện minh.',
    test:(a) => a.owner === UNASSIGNED },
  { k:'approve', n:'2', l:'Chờ duyệt',
    sub:'Có owner rồi, đợi người có thẩm quyền quyết định. Bắt buộc với mọi thay đổi chạm khách.',
    test:(a) => a.owner !== UNASSIGNED && a.ap === 'pending' },
  { k:'fix',     n:'3', l:'Đang sửa',
    sub:'Đã duyệt, đang triển khai. Chưa ra bản thì chưa có gì để đo.',
    test:(a) => a.ap === 'approved' && a.dl !== 'released' },
  { k:'verify',  n:'4', l:'Đang verify',
    sub:'Đã ra bản, đang so trước – sau. Còn yếu tố nhiễu thì không được kết luận là cải thiện.',
    test:(a) => a.dl === 'released' && a.iv !== 'validated' },
];
const laneOf = (a) => (LANES.find((L) => L.test(a)) || { k:'off' }).k;

V.work = () => {
  const noOwner = ACT.filter((a) => a.owner === UNASSIGNED).length;
  const pend    = ACT.filter((a) => a.owner !== UNASSIGNED && a.ap === 'pending').length;
  const onBoard = ACT.filter((a) => laneOf(a) !== 'off').length;
  const closed  = ACT.filter((a) => a.lc === 'closed').length;
  const waitLoop= ACT.filter((a) => a.iv === 'validated' && a.lc !== 'closed').length;
  const lead = noOwner
    ? `${noOwner} điểm gãy chưa có người chịu trách nhiệm, ${pend} đang chờ duyệt.`
    : `${onBoard} điểm gãy đang trong vòng xử lý, ${pend} chờ người có thẩm quyền quyết định.`;

  return `<div class="wrap">
    <h1 class="t-hero" style="max-width:32ch;margin-bottom:8px">${lead}</h1>
    <p class="t-meta" style="max-width:88ch;margin:0 0 14px">Bốn làn dưới đây là <b>việc còn cần tay người</b>. Việc đã verify xong rời board xuống khối cuối màn — board không phải kho lưu trữ. Bấm thân thẻ để mở hồ sơ đầy đủ; nút trên thẻ chạy đúng bước kế tiếp của thẻ đó.</p>

    <div class="tabs" style="margin-bottom:14px">
      <button class="${(ST.sub.work||'lanes')==='lanes'?'on':''}" onclick="setSub('work','lanes')">Theo làn công việc</button>
      <button class="${ST.sub.work==='pri'?'on':''}" onclick="setSub('work','pri')">Xếp theo ưu tiên</button>
    </div>

    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn pri" onclick="openCreate()">＋ Tạo điểm gãy</button>
      <span class="t-meta" style="font-size:12px">Chỉ tạo khi xác định được bước trong hành trình và chỉ số dùng để kết luận.</span>
      <div class="grow"></div>
      ${waitLoop ? `<span class="chip" style="color:var(--watch);border-color:var(--watch-line)">${waitLoop} chờ khép vòng với khách</span>` : ''}
      <span class="chip">Đã xong ${closed}</span>
    </div>

    ${/* Banner và form phải nằm ở khối DÙNG CHUNG cho cả hai chế độ. Trước đó
          chúng nằm trong nhánh 'lanes', nên bấm "Tạo điểm gãy" khi đang ở tab
          ưu tiên thì openCreate() đặt state, render() chạy, mà không có gì hiện
          ra. Alias #/health lại đáp thẳng vào đúng tab đó. */''}
    ${ST.sel.mkok ? `<div class="note bd" style="margin-bottom:14px"><b>Đã tạo ${esc(ST.sel.mkok)}.</b>
      Thẻ đang ở làn ${esc(ST.sel.mkokLane || '')}. Toàn bộ liên kết dữ liệu vẫn hợp lệ — không có banner đỏ nghĩa là <span class="mono">validateFixture()</span> đã chấp nhận bản ghi mới.
      <button class="disc" style="margin-left:8px" onclick="setSel('mkok',null)">ẩn</button></div>` : ''}
    ${ST.sel.asok ? `<div class="note bd" style="margin-bottom:14px"><b>Đã gán ${esc(action(ST.sel.asok) ? action(ST.sel.asok).owner : '')}</b> cho ${esc(ST.sel.asok)}, thẻ đã chuyển sang làn Chờ duyệt.
      <button class="disc" style="margin-left:8px" onclick="setSel('asok',null)">ẩn</button></div>` : ''}
    ${ST.sel.mkiss ? createForm() : ''}
    ${ST.sel.assign ? assignForm(ST.sel.assign) : ''}

    ${ST.sub.work === 'pri' ? `${frictionQueue()}
      <div class="note" style="margin-top:14px">Chế độ này xếp điểm gãy theo <b>mức ưu tiên</b>, xuyên bước và xuyên flow — khác với bốn làn ở tab bên cạnh vốn xếp theo <b>trạng thái xử lý</b>. Trọng số của sáu thành phần đặt ở <a href="#/rules">Chỉ số &amp; ngưỡng</a>.</div>
    </div>` : ''}
    ${ST.sub.work === 'pri' ? '' : `

    <div class="lanes" data-tour="work-lanes">${LANES.map((L) => {
      const list = ACT.filter((a) => laneOf(a) === L.k)
        .sort((x, y) => iss(y.iss).pri.total - iss(x.iss).pri.total);
      return `<div class="lane ${L.k === 'assign' && list.length ? 'hot' : ''}" data-tour="work-lane-${L.k}">
        <div class="lh"><span class="lnum">${L.n}</span><b>${L.l}</b><span class="lc">${list.length}</span></div>
        <div class="lsub">${L.sub}</div>
        <div class="lbody">${list.length ? list.map((a) => workCard(a)).join('')
          : `<div class="laneempty">Không có thẻ nào ở làn này.</div>`}</div>
      </div>`;
    }).join('')}</div>

    <div class="hr"></div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:13px">
      <button class="disc" onclick="tog('wk-out')">${ST.sel['wk-out'] ? 'Ẩn' : 'Xem'} kết quả đã đo (${DATA.out.length}) ${ST.sel['wk-out'] ? '▴' : '▾'}</button>
      <button class="disc" onclick="tog('wk-loop')">${ST.sel['wk-loop'] ? 'Ẩn' : 'Xem'} khép vòng với khách (${DATA.loop.length + ACT.filter((a) => a.iv === 'validated' && !loop(a.iss)).length}) ${ST.sel['wk-loop'] ? '▴' : '▾'}</button>
      <span class="t-meta" style="font-size:12px">Hai khối này cố ý đóng sẵn — chỉ mở khi cần đối chiếu, không chiếm chỗ của việc đang chạy.</span>
    </div>
    ${ST.sel['wk-out'] ? outcomeSection() : ''}
    ${ST.sel['wk-loop'] ? loopSection() : ''}
  </div>`}`;
};

function workCard(a) {
  const i = iss(a.iss), s = step(i.step), n = nextStepOf(a), lane = laneOf(a), o = outc(a.id);
  return `<div class="wk ${SEV[i.sev]}">
    <div onclick="go('issue/${i.id}')">
      <div class="wkid"><span>${i.id}</span>${badge(SEV[i.sev], SEV_LABEL[i.sev])}</div>
      <div class="wkt">${esc(i.title)}</div>
      <div class="wkm"><span class="chip">${s.code} · ${esc(s.name)}</span></div>
      <div class="wkm" style="margin-top:6px">
        ${a.owner === UNASSIGNED ? '<b style="color:var(--crit)">Chưa gán</b>' : esc(a.owner)}
        <span class="dim">· hạn ${esc(a.due)}</span>
        <span class="wkp" title="Điểm ưu tiên">${i.pri.total}</span>
      </div>
      ${lane === 'verify' ? verifyStrip(a, o)
        : lane === 'fix' ? `<div class="wkm" style="margin-top:6px">Thành công khi <b>${esc(metric(a.sm).name)} ${esc(metric(a.sm).target)}</b></div>`
        : lane === 'approve' ? `<div class="wkm" style="margin-top:6px">Người duyệt <b>${esc(a.acc)}</b></div>`
        : `<div class="wkm" style="margin-top:6px">${ST_ISS[i.st]} · ${nf(fx(i.imp.aff))} khách bị ảnh hưởng · tin cậy ${i.conf}%</div>`}
    </div>
    <div style="margin-top:10px">
      ${lane === 'assign'
        ? `<button class="btn pri sm" style="width:100%;justify-content:center" onclick="openAssign('${a.id}')">Gán người xử lý</button>
           <div class="t-meta" style="font-size:12px;text-align:center;margin-top:5px">Không duyệt được khi chưa có owner</div>`
        : `<button class="btn ${n.k === 'hold' ? '' : 'pri'} sm" style="width:100%;justify-content:center" onclick="advance('${a.id}')">${esc(n.label)}</button>
           <div class="t-meta" style="font-size:12px;text-align:center;margin-top:5px">${esc(n.actor)}</div>`}
    </div>
  </div>`;
}

/* Dải trước–sau gọn cho thẻ ở làn verify. Hướng tốt/xấu theo dấu trong target,
   không mặc định "tăng là tốt". */
function verifyStrip(a, o) {
  const m = metric(a.sm);
  if (!o) return `<div class="note" style="margin-top:8px;font-size:12px">${badge('unknown')} Chưa đủ cửa sổ quan sát để đo.</div>`;
  const v = VERDICT[o.verdict], d = Math.round((o.post.v - o.base.v) * 10) / 10;
  const better = mdir(m) === 'down' ? d < 0 : d > 0;
  return `<div class="note ${o.verdict === 'inconclusive' ? 'warn' : o.verdict === 'worse' ? 'crit' : ''}" style="margin-top:8px;font-size:12px">
    <div style="display:flex;align-items:center;gap:6px">
      <span class="mono">${String(o.base.v).replace('.', ',')}${o.base.u}</span><span class="dim">→</span>
      <b class="mono">${String(o.post.v).replace('.', ',')}${o.post.u}</b>
      <span class="mono" style="color:${better ? 'var(--good)' : 'var(--crit)'}">${d > 0 ? '+' : ''}${String(d).replace('.', ',')}</span>
    </div>
    <div style="margin-top:6px">${badge(v.s, v.l)}</div>
    ${o.conf.length ? `<div style="margin-top:5px;color:var(--crit)">⚠ ${o.conf.length} yếu tố nhiễu — chưa được kết luận là cải thiện</div>` : ''}
  </div>`;
}

/* ---------- Form tạo điểm gãy ---------- */
const fld = (label, inner, hint) => `<div style="min-width:0">
  <div class="t-lbl" style="margin-bottom:5px">${label}</div>${inner}
  ${hint ? `<div class="t-meta" style="font-size:12px;margin-top:4px">${hint}</div>` : ''}</div>`;
const opts = (arr, sel) => arr.map((v) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

function createForm() {
  return `<div class="card" style="margin-bottom:16px;border-color:var(--primary-line)">
    ${chead('Tạo điểm gãy mới', 'Điểm gãy phải neo vào một bước trong hành trình và một chỉ số dùng để kết luận — nếu không thì sau này không ai đo được là đã sửa xong hay chưa.')}
    <div class="cbody">
      ${ST.sel.mkerr ? `<div class="note crit" style="margin-bottom:13px">${esc(ST.sel.mkerr)}</div>` : ''}
      <div style="display:grid;gap:13px 16px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:13px">
        ${fld('Bước trong hành trình', `<select class="sel-in" id="ni-step" style="width:100%">${DATA.steps.map((s) => `<option value="${s.id}">${s.code} · ${esc(s.name)}</option>`).join('')}</select>`,
          'Chỉ 6 bước của pilot có dữ liệu quan sát')}
        ${fld('Chỉ số dùng để kết luận', `<select class="sel-in" id="ni-metric" style="width:100%">${DATA.metrics.map((m) => `<option value="${m.id}">${esc(m.name)} · ${esc(m.target)}</option>`).join('')}</select>`,
          'Đây là thước đo ở làn verify sau này')}
      </div>
      ${fld('Tiêu đề — một câu nói rõ khách đang gặp gì',
        `<input class="srchin" id="ni-title" type="text" placeholder="ví dụ: Khách không nhận được xác nhận sau khi ký hợp đồng">`)}
      <div style="display:grid;gap:13px 16px;grid-template-columns:repeat(4,minmax(0,1fr));margin:13px 0">
        ${fld('Mức nghiêm trọng', `<select class="sel-in" id="ni-sev" style="width:100%">
          <option value="critical">Cần xử lý ngay</option><option value="high" selected>Cần theo dõi</option><option value="medium">Đang quan sát</option></select>`)}
        ${fld('Người xử lý', `<select class="sel-in" id="ni-owner" style="width:100%"><option value="">— để gán sau —</option>${opts(OWNERS)}</select>`,
          'Để trống thì thẻ rơi vào làn 1')}
        ${fld('Người duyệt', `<select class="sel-in" id="ni-acc" style="width:100%">${opts(APPROVERS)}</select>`)}
        ${fld('Hạn xử lý', `<input class="srchin" id="ni-due" type="date">`, 'Trống thì đặt 14 ngày')}
      </div>
      ${fld('Mô tả cho người đọc — không dùng thuật ngữ nội bộ',
        `<textarea class="srchin" id="ni-plain" rows="2" placeholder="Trống thì hệ thống ghi sẵn một câu nêu rõ đây là điểm gãy mới, chưa có bằng chứng."></textarea>`)}
      <div style="display:flex;gap:9px;align-items:center;margin-top:14px">
        <button class="btn pri" onclick="createIssue()">Tạo điểm gãy</button>
        <button class="btn" onclick="closeCreate()">Hủy</button>
        <div class="grow"></div>
        <div class="t-meta" style="font-size:12px;max-width:56ch;text-align:right">Bản ghi mới sinh kèm một hành động ở trạng thái <span class="mono">chờ duyệt</span> và điểm ưu tiên tự tính từ mức nghiêm trọng cộng số khách rơi tại bước. Không có bằng chứng nào được gán — độ tin cậy đặt 50%.</div>
      </div>
    </div>
  </div>`;
}

/* ---------- Panel gán người xử lý ---------- */
function assignForm(aid) {
  const a = action(aid);
  if (!a) return '';
  const i = iss(a.iss), s = step(i.step);
  return `<div class="card" style="margin-bottom:16px;border-color:var(--primary-line)">
    ${chead('Gán người xử lý · ' + i.id, esc(i.title))}
    <div class="cbody">
      ${ST.sel.aserr ? `<div class="note crit" style="margin-bottom:13px">${esc(ST.sel.aserr)}</div>` : ''}
      <div class="note" style="margin-bottom:14px">
        <dl class="kv" style="grid-template-columns:auto 1fr auto 1fr">
          <dt>Bước</dt><dd>${s.code} · ${esc(s.name)}</dd>
          <dt>Mức</dt><dd>${SEV_LABEL[i.sev]}</dd>
          <dt>Khách bị ảnh hưởng</dt><dd>${nf(fx(i.imp.aff))}</dd>
          <dt>Bằng chứng</dt><dd>${i.ev.length ? i.ev.length + ' bản ghi' : '<span style="color:var(--crit)">chưa có</span>'}</dd>
        </dl>
      </div>
      <div style="display:grid;gap:13px 16px;grid-template-columns:repeat(3,minmax(0,1fr))">
        ${fld('Người xử lý', `<select class="sel-in" id="as-owner" style="width:100%"><option value="">— chọn người —</option>${opts(OWNERS)}</select>`)}
        ${fld('Người duyệt', `<select class="sel-in" id="as-acc" style="width:100%">${opts(APPROVERS, a.acc)}</select>`)}
        ${fld('Hạn xử lý', `<input class="srchin" id="as-due" type="date">`, 'Trống thì giữ hạn ' + esc(a.due))}
      </div>
      <div style="display:flex;gap:9px;align-items:center;margin-top:14px">
        <button class="btn pri" onclick="saveAssign('${a.id}')">Gán và chuyển sang chờ duyệt</button>
        <button class="btn" onclick="closeAssign()">Hủy</button>
        <div class="grow"></div>
        <div class="t-meta" style="font-size:12px">Bản thật ghi audit trail: ai gán, lúc nào, từ ai sang ai.</div>
      </div>
    </div>
  </div>`;
}

function nextStepOf(a) {
  if (a.ap === 'pending')       return { k:'approve', actor:'Người phụ trách quyết định', label:'Duyệt đề xuất xử lý' };
  if (a.dl === 'backlog')       return { k:'start',   actor:'Owner cập nhật trạng thái',   label:'Bắt đầu triển khai' };
  if (a.dl === 'in-progress')   return { k:'release', actor:'Owner cập nhật trạng thái',   label:'Đánh dấu đã phát hành' };
  if (!outc(a.id))              return { k:'observe', actor:'Hệ thống mô phỏng',           label:'Nhận dữ liệu đánh giá demo' };
  if (outc(a.id).verdict === 'inconclusive' && a.iv !== 'validated')
                                return { k:'hold',    actor:'Người phụ trách kết luận',    label:'Chưa kết luận được — xem confounder' };
  if (a.iv !== 'validated')     return { k:'validate',actor:'Người phụ trách kết luận',    label:'Xác nhận kết quả đánh giá' };
  if (a.lc !== 'closed')        return { k:'close',   actor:'CX xác nhận trạng thái',      label:'Đánh dấu đã khép vòng' };
  return { k:'done', actor:'', label:'Hoàn tất' };
}
function actionRow(a) {
  const i = iss(a.iss), m = metric(a.sm), n = nextStepOf(a);
  return `<div style="padding:15px 17px">
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <span class="mono" style="font-size:12px;color:var(--ink3)">${a.id}</span>
          ${badge(SEV[i.sev], SEV_LABEL[i.sev])}
          <a href="#/issue/${i.id}" class="chip b">${i.id}</a>
        </div>
        <div class="t-item" style="margin:7px 0 6px">${esc(a.title)}</div>
        <dl class="kv" style="grid-template-columns:auto 1fr auto 1fr;max-width:780px">
          <dt>Owner</dt><dd>${esc(a.owner)}</dd>
          <dt>Người duyệt</dt><dd>${esc(a.acc)}</dd>
          <dt>Hạn</dt><dd>${esc(a.due)}</dd>
          <dt>Thành công khi</dt><dd>${esc(m.name)} ${esc(m.target)}</dd>
          ${a.rel ? `<dt>Bản phát hành</dt><dd>${esc(a.rel)}</dd>` : ''}
        </dl>
      </div>
      <div style="flex:none;width:250px">
        ${loopSteps(a)}
        ${n.k !== 'done' ? `<div class="t-lbl" style="margin:12px 0 5px">${esc(n.actor)}</div>
          <button class="btn ${n.k==='hold'?'':'pri'}" style="width:100%;justify-content:center" onclick="advance('${a.id}')">${esc(n.label)}</button>`
        : `<div class="note bd" style="margin-top:12px;text-align:center"><b>Vòng xử lý đã hoàn tất</b></div>`}
        <div class="t-meta" style="font-size:12px;text-align:center;margin-top:7px">Thao tác chỉ đổi trạng thái demo trong phiên.</div>
      </div>
    </div>
  </div>`;
}
function loopSteps(a) {
  const rows = [
    { l:'Duyệt đề xuất',      done:a.ap === 'approved' },
    { l:'Triển khai thay đổi',done:a.dl === 'released' },
    { l:'Đo sau thay đổi',    done:a.iv === 'validated' },
    { l:'Khép vòng với khách',done:a.lc === 'closed' },
  ];
  return `<div style="display:grid;gap:5px">${rows.map((r, n) => `
    <div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
      <span style="width:21px;height:21px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
        ${r.done?'background:var(--good);color:#fff':'background:#fff;border:1px solid var(--line);color:var(--ink3)'}">${r.done?'✓':n+1}</span>
      <span style="${r.done?'color:var(--good);font-weight:600':'color:var(--ink3)'}">${esc(r.l)}</span>
    </div>`).join('')}</div>`;
}

/* ---------- Hai khối cuối màn Bảng xử lý ----------
   Không còn là route riêng. Đóng sẵn, mở khi cần đối chiếu. */
function outcomeSection() {
  const rel = ACT.filter((a) => a.dl === 'released' || outc(a.id));
  const measured = DATA.out.length, proved = DATA.out.filter((o) => o.verdict === 'improved').length;
  return `<div style="margin-bottom:16px">
    <div class="note ${proved === 0 ? 'warn' : ''}" style="margin-bottom:13px">
      <b>Trong ${measured} thay đổi đã đo, ${proved === 0 ? 'chưa có thay đổi nào' : 'chỉ ' + proved} chứng minh được là có tác dụng.</b>
      Một thay đổi đã release không có nghĩa là vấn đề đã được giải quyết. Khi còn yếu tố nhiễu thì <b>không</b> được kết luận là cải thiện.
    </div>
    ${rel.length ? rel.map((a) => outcomeCard(a)).join('') : '<div class="empty">Chưa có thay đổi nào được phát hành trong kỳ.</div>'}
  </div>`;
}

/* Bảng khép vòng gộp cả những thẻ đã verify xong mà CHƯA có danh sách khách —
   nếu không gộp thì thẻ rời board rồi biến mất, không còn đường bấm tiếp. */
function loopSection() {
  const extra = ACT.filter((a) => a.iv === 'validated' && !loop(a.iss));
  const row = (iid, need, done, ch, by, sent, act) => {
    const i = iss(iid);
    const cta = act && act.iv === 'validated' && act.lc !== 'closed'
      ? `<button class="btn pri sm" onclick="event.stopPropagation();advance('${act.id}')">Đánh dấu đã khép vòng</button>` : '';
    return `<tr class="clickable" onclick="go('issue/${iid}')">
      <td><span class="mono" style="font-size:12px;color:var(--ink3)">${iid}</span><div class="t-meta" style="color:var(--ink)">${esc(i ? i.title : '')}</div></td>
      <td>${need == null ? '<span class="t-meta">chưa lập</span>' : `<b class="num">${nf(need)}</b>`}</td>
      <td>${done == null ? '<span class="t-meta">—</span>' : `<b class="num" style="color:${done >= need ? 'var(--good)' : 'var(--ink3)'}">${nf(done)}</b>`}</td>
      <td class="t-meta">${esc(ch)}</td>
      <td class="t-meta">${by ? esc(by) : '<span style="color:var(--crit)">Chưa duyệt</span>'}</td>
      <td class="t-meta">${sent ? esc(sent) : '—'}</td>
      <td>${cta}</td>
    </tr>`;
  };
  return `<div class="card" style="margin-bottom:16px">
    ${chead('Khép vòng với khách hàng', 'Số khách cần được thông báo sau khi vấn đề được xử lý. Nội dung gửi khách bắt buộc có người duyệt.',
      DATA.loop.length + extra.length, DATA.iss.length, 'điểm gãy')}
    <table>
      <thead><tr><th>Điểm gãy</th><th>Khách cần liên hệ</th><th>Đã liên hệ</th><th>Kênh</th><th>Người duyệt nội dung</th><th>Sentiment sau đó</th><th></th></tr></thead>
      <tbody>
        ${DATA.loop.map((l) => row(l.iss, l.need, l.done, l.ch, l.by, l.sent, ACT.find((a) => a.iss === l.iss))).join('')}
        ${extra.map((a) => row(a.iss, null, null, 'Chưa chọn kênh', null, null, a)).join('')}
      </tbody>
    </table>
  </div>`;
}

const VERDICT = {
  improved:     { s:'ok',      l:'Chứng minh được là cải thiện' },
  'no-change':  { s:'watch',   l:'Không thay đổi đáng kể' },
  worse:        { s:'crit',    l:'Xấu hơn' },
  inconclusive: { s:'unknown', l:'Chưa kết luận được' },
};
function outcomeCard(a) {
  const o = outc(a.id), i = iss(a.iss), m = metric(a.sm);
  if (!o) return `<div class="card" style="margin-bottom:14px">${chead(a.title, a.id + ' · đã phát hành, chưa có dữ liệu quan sát')}
    <div class="cbody"><div class="note">${badge('unknown')} Chưa đủ cửa sổ quan sát để đo.</div></div></div>`;
  const v = VERDICT[o.verdict], delta = Math.round((o.post.v - o.base.v) * 10) / 10;
  const better = m.id === 'm-repeat' ? delta < 0 : delta > 0;
  return `<div class="card" style="margin-bottom:14px">
    ${chead(a.title, a.id + ' · ' + i.id + ' · ' + esc(a.rel || 'chưa ghi bản phát hành'), 1, 1, 'cửa sổ quan sát')}
    <div class="cbody">
      <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:15px">
        ${stat('Trước thay đổi', o.base.v + o.base.u, o.base.p, 'n = ' + nf(o.base.n) + ' · ' + esc(m.name))}
        ${stat('Sau thay đổi', o.post.v + o.post.u, o.post.p, 'n = ' + nf(o.post.n) + ' · cùng grain',
          o.verdict === 'improved' ? 'var(--good)' : o.verdict === 'worse' ? 'var(--crit)' : undefined)}
        ${stat('Chênh lệch', (delta > 0 ? '+' : '') + delta + o.post.u,
          o.verdict === 'inconclusive' ? (better ? 'Đúng hướng, nhưng chưa đủ căn cứ' : 'Ngược hướng, chưa đủ căn cứ')
                                       : (better ? 'Theo hướng mong muốn' : 'Ngược hướng mong muốn'),
          'Mục tiêu ' + esc(m.target),
          o.verdict === 'inconclusive' ? undefined : better ? 'var(--good)' : 'var(--crit)')}
        <div class="stat">
          <div class="t-lbl">Kết luận</div>
          <div style="margin:6px 0 5px">${badge(v.s, v.l)}</div>
          <div class="src">${o.by ? esc(o.by) : 'Chưa có người kết luận'}</div>
        </div>
      </div>
      <dl class="kv" style="grid-template-columns:auto 1fr;max-width:900px;margin-bottom:13px">
        <dt>Cohort</dt><dd>${esc(o.cohort)}</dd>
        <dt>Cửa sổ quan sát</dt><dd>${esc(o.win)}</dd>
        <dt>Metric</dt><dd>${esc(m.name)} · grain ${esc(m.grain)}</dd>
      </dl>
      ${o.conf.length ? `<div class="note crit">
        <b>⚠ ${o.conf.length} yếu tố nhiễu (confounder) — không được coi tương quan là nhân quả</b>
        <ul style="margin:8px 0 0;padding-left:19px">${o.conf.map((c) => `<li style="margin:3px 0">${esc(c)}</li>`).join('')}</ul>
        ${o.verdict === 'inconclusive' ? '<div style="margin-top:9px">Vì còn yếu tố nhiễu, hệ thống <b>không cho phép</b> kết luận là cải thiện mà chưa có người phụ trách ghi nhận rõ lý do.</div>' : ''}
      </div>` : `<div class="note"><b>Không phát hiện yếu tố nhiễu.</b> Cùng kỳ không có release nào khác chạm vào bước này, volume không lệch bất thường.</div>`}
      <div class="note" style="margin-top:11px;font-size:12px">Lưu ý về prototype: trước và sau là <b>hai snapshot rời</b>, không phải chuỗi thời gian liên tục. Bản thật cần time-series và release marker thật.</div>
    </div>
  </div>`;
}

/* ---------- Hồ sơ điểm gãy /issue/:id ----------
   5 tab. Tab Xử lý và Kết quả CÓ CTA thao tác được tại chỗ — cố ý, để người ra

V.issue = (id) => {

  return `<div class="wrap">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
      <button class="btn sm" onclick="go('health')">← Quay lại</button>
      <span class="mono" style="font-size:12px;color:var(--ink3)">${i.id}</span>
      ${badge(SEV[i.sev], SEV_LABEL[i.sev])}
      <span class="chip">${s.code} · ${esc(s.name)}</span>
      <span class="chip mono">${esc(s.stationId)}</span>
      <div class="grow"></div>

    <h1 class="t-hero" style="max-width:30ch;margin-bottom:10px">${esc(i.title)}</h1>
    <p class="t-body" style="max-width:86ch;margin:0 0 16px;color:var(--ink2)">${esc(i.plain)}</p>

    <div class="card">
      <div class="tabs">${TABS.map(([k, l]) => `<button class="${tab===k?'on':''}" onclick="setSub('issue','${k}')">${l}</button>`).join('')}</div>
      <div class="cbody">${
        tab === 'ev' ? `
          <div class="note bd" style="margin-bottom:14px"><b>Giả thuyết:</b> ${esc(i.hyp)}</div>
          ${i.ev.length ? `<div style="display:grid;gap:11px">${i.ev.map((eid) => { const e = ev(eid); return `
            <div class="quote">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
                ${catChip(e.cat)}<span class="chip">${esc(src(e.src).name)}</span>

                <div class="grow"></div><span class="t-meta">${esc(e.at)}</span>
              </div>
              <p>“${esc(e.q)}”</p>
              <div class="qm"><span>🔒 ${esc(e.ck)} · ${esc(e.sig)}</span><span class="mono">${taxPathAll(e.tax)}</span></div>
            </div>`; }).join('')}</div>`
            : `<div class="note crit">${badge('unknown')} <b>Chưa có bằng chứng từ khách hàng.</b> Điểm gãy này hiện chỉ dựa trên tín hiệu hành vi, nên độ tin cậy chỉ ${i.conf}%. Cần bổ sung khảo sát hoặc verbatim trước khi duyệt thay đổi.</div>`}
          <div class="hr"></div>
          <button class="disc" onclick="tog('mc-${i.id}')">${ST.sel['mc-'+i.id]?'Ẩn định nghĩa đo lường ▴':'Xem định nghĩa đo lường ▾'}</button>
          ${ST.sel['mc-'+i.id] ? `<div class="note" style="margin-top:10px">
            <div class="t-lbl" style="margin-bottom:7px">Metric contract</div>
            <dl class="kv" style="grid-template-columns:auto 1fr">
              <dt>Metric</dt><dd>${esc(m.name)} ${metricBadge(m)}</dd>

              <dt>Ngưỡng đang áp</dt><dd>${CFG.metric[m.id] && CFG.metric[m.id].on
                ? `cần theo dõi khi ${mdir(m)==='down'?'vượt':'dưới'} ${String(CFG.metric[m.id].watch).replace('.',',')} · cần xử lý khi ${mdir(m)==='down'?'vượt':'dưới'} ${String(CFG.metric[m.id].crit).replace('.',',')}`

              <dt>Grain</dt><dd>${esc(m.grain)}</dd>

        : tab === 'imp' ? `

                  <div class="t-item">${esc(tax(vi.theme).name)}</div>
                  <div class="t-meta" style="margin:4px 0 7px">${nf(vi.n)} phản hồi · positive ${vi.pos}% · ${vi.trend<0?'giảm':'tăng'} ${Math.abs(vi.trend)}pt qua 6 kỳ · ${vi.src.length} nguồn</div>
                  <div class="t-body">${esc(vi.rec)}</div>

        : tab === 'cust' ? (() => {

              ${stat('Nhóm giá trị cao', String(cs.filter((c) => c.tier === 'high-value').length), 'cần ưu tiên khi liên hệ', 'CRM valueTier')}
              ${stat('Cần liên hệ khép vòng', l ? nf(l.need) : '—', l ? `đã liên hệ ${nf(l.done)} · kênh ${l.ch}` : 'chưa lập danh sách', '')}

          <div class="hr"></div>
          <div class="t-lbl" style="margin-bottom:9px">Khép vòng với khách hàng</div>

              <dt>Người duyệt nội dung</dt><dd>${l.by ? esc(l.by) : 'Chưa duyệt — nội dung gửi khách bắt buộc có người duyệt'}</dd>
