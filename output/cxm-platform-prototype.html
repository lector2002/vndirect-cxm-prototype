/* ---------- Bản đồ hành trình ----------
   Điều hướng ba nhịp NGANG, không còn catalog dọc phải kéo xuống mới thấy hết
   20 flow:  rail 7 phase  →  chip flow trong phase  →  xương sống các bước.
   Tương quan giữa các bước nằm ở dải nối `.cx`: độ dày = số khách còn lại so
   với bước đầu, vạch đỏ bên dưới = phần rơi ra tại bước bên trái. */
V.atlas = () => {
  const fid = ST.sel.atlas || 'f-open-2026';
  const flow = byId(DATA.flows, fid);
  const phaseOf = (f) => byId(DATA.groups, f.groupId).phaseId;
  const pid = ST.sel.atlasPhase || phaseOf(flow);
  const steps = DATA.steps.filter((s) => s.flowId === fid);
  const sid = ST.sel.atlasStep || (steps[0] && steps[0].id);
  const observed = DATA.flows.filter((f) => f.observed).length;
  const dotOf = (f) => (f.observed ? 'var(--primary)' : f.verified ? 'var(--ink3)' : '#D6D1CB');
  const stateOf = (f) => (f.observed ? 'Có dữ liệu quan sát' : f.verified ? 'Có nguồn · chưa có dữ liệu' : 'Chờ nguồn');

  return `<div class="wrap">
    <h1 class="t-hero" style="max-width:38ch;margin-bottom:8px">${DATA.flows.length} flow trên ${DATA.phases.length} phase, ${DATA.flows.filter((f) => f.verified).length} flow có nguồn xác minh, ${observed} flow đang có dữ liệu quan sát.</h1>
    <p class="t-meta" style="max-width:92ch;margin:0 0 16px">Chọn phase ở hàng trên, chọn nhóm sản phẩm và flow ở hàng dưới, rồi đọc chuỗi bước theo chiều ngang. Bề dày dải nối cho biết <b>còn bao nhiêu khách đi tiếp</b>; vạch đỏ cho biết <b>rơi bao nhiêu ở bước trước đó</b>. Màn này đo <b>hành vi</b>; tiếng nói của khách tại cùng những điểm chạm này nằm ở <a href="#/vocjourney">VoC theo hành trình</a>.</p>

    <div class="prail" data-tour="atlas-prail">${DATA.phases.map((p) => {
      const fl = DATA.flows.filter((f) => phaseOf(f) === p.id);
      return `<button class="${p.id === pid ? 'on' : ''}" onclick="setAtlasPhase('${p.id}')"
              title="${esc(p.name)} · ${fl.length} flow">
        <div class="pc">${p.code}</div>
        <div class="pn">${esc(p.name)}</div>
        <div class="pd">${fl.map((f) => `<i style="background:${dotOf(f)}"></i>`).join('')}<span>${fl.length} flow</span></div>
      </button>`;
    }).join('')}</div>

    <div class="card" style="margin-bottom:14px">
      ${chead(DATA.phases.find((p) => p.id === pid).code + ' · ' + DATA.phases.find((p) => p.id === pid).name,
              'Chọn một flow để mở chuỗi bước',
              DATA.flows.filter((f) => phaseOf(f) === pid).length, DATA.flows.length, 'flow')}
      <div class="cbody tight" style="padding:13px 15px">
        <div class="frail">${DATA.groups.filter((g) => g.phaseId === pid).map((g) => `
          <div>
            <div class="t-lbl" style="margin-bottom:6px">${esc(g.name)}</div>
            <div class="fchips">${DATA.flows.filter((f) => f.groupId === g.id).map((f) => `
              <button class="${f.id === fid ? 'on' : ''}" onclick="setAtlas('${f.id}')" title="${esc(stateOf(f))}">
                <i style="background:${dotOf(f)}"></i>${esc(f.name)}
              </button>`).join('')}</div>
          </div>`).join('')}</div>
        <div class="t-meta" style="font-size:12px;margin-top:11px;display:flex;gap:15px;flex-wrap:wrap">
          <span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary)"></i> có dữ liệu quan sát</span>
          <span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3)"></i> có sơ đồ nguồn, chưa đo</span>
          <span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#D6D1CB"></i> chờ nguồn</span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      ${chead(flow.name, flow.owner + ' · ' + flow.version + ' · ' + (flow.verified ? 'Nguồn: ' + flow.src : 'chưa có sơ đồ nguồn, cần xác minh'),
              steps.length, steps.length || 0, 'bước')}
      <div class="cbody">${steps.length ? journeySpine(steps, sid) : `
        <div class="note warn">${badge('unknown')} <b>Chưa có dữ liệu quan sát.</b> Flow này đã được map ở mức cấu trúc nhưng chưa nằm trong pilot, nên chưa có bước, signal hay số liệu. Đây là chủ ý, không phải mất dữ liệu.
          <div style="margin-top:8px">Muốn đo flow này thì cần: xác minh sơ đồ nguồn → khai báo bước và <span class="mono">stationId</span> → instrument signal → chọn chỉ số theo dõi ở màn <a href="#/rules">Chỉ số &amp; ngưỡng</a>.</div>
        </div>`}
      </div>
    </div>

    ${sid && steps.length ? stepInspector(sid) : ''}
  </div>`;
};

/* Xương sống hành trình. Vẽ bằng flexbox: mỗi bước một thẻ, giữa hai thẻ là
   một dải nối cao theo tỷ lệ khách còn lại so với bước đầu (`base`). */
function journeySpine(steps, sid) {
  const H = 112; /* px ứng với 100% khách của bước đầu */
  const base = obs(steps[0].id).entered;
  const last = obs(steps[steps.length - 1].id);
  const lostAll = base - last.completed;
  const worst = steps.slice().sort((a, b) => obs(b.id).failed - obs(a.id).failed)[0];

  const node = (s) => {
    const o = obs(s.id), st = stepState(o);
    const tone = st === 'crit' ? 'var(--crit)' : st === 'watch' ? 'var(--watch)' : 'var(--good)';
    return `<button class="sn ${st} ${s.id === sid ? 'on' : ''}" onclick="setSel('atlasStep','${s.id}')"
            title="${esc(s.name)} — ${esc(stepWhy(o))}">
      <div class="sc">${s.code} · ${esc(s.stationId)}</div>
      <div class="snm">${esc(s.name)}</div>
      <div class="sv">${nf(fx(o.completed))}</div>
      <div class="sl">hoàn tất / ${nf(fx(o.entered))} vào</div>
      <div class="smeter"><i style="width:${o.cov}%;background:${o.cov < CFG.step.covMin ? 'var(--watch)' : 'var(--ink3)'}"></i></div>
      <div class="sl">Evidence ${o.cov}% · ↻ ${String(o.effort).replace('.', ',')} lần thử</div>
      <div style="margin-top:9px">${badge(st)}</div>
    </button>`;
  };

  /* Khung dải cao CỐ ĐỊNH bằng H để mọi nhãn % nằm cùng một cao độ; chỉ phần
     tô bên trong thay đổi. Nếu để khung co theo dữ liệu thì các nhãn lệch nhau
     và trông như lỗi trình bày chứ không như một cái phễu. */
  const conn = (i) => {
    const o = obs(steps[i].id), nx = obs(steps[i + 1].id);
    const lost = o.entered - nx.entered;
    const passPx = Math.max(4, (nx.entered / base) * H);
    const lossPx = Math.max(3, (lost / base) * H);
    return `<div class="cx" title="Rơi tại bước ${steps[i].code}: ${nf(fx(lost))} khách · ${pv(lost, o.entered)}% người vào bước đó · chiếm ${pv(lost, lostAll)}% tổng số rơi của flow">
      <div class="cxband" style="height:${H}px">
        <div class="cxpass" style="height:${passPx}px"></div>
        <div class="cxloss" style="top:${passPx}px;height:${lossPx}px"></div>
      </div>
      <div class="cxlbl"><b>−${pv(lost, o.entered)}%</b><span>${nf(fx(lost))} rơi</span></div>
    </div>`;
  };

  return `<div class="spine" data-tour="atlas-spine">${steps.map((s, i) =>
      node(s) + (i < steps.length - 1 ? conn(i) : '')).join('')}</div>
    <div class="note" style="margin-top:15px">
      <b>Đọc theo chiều ngang:</b> ${nf(fx(base))} khách vào bước ${steps[0].code}, còn ${nf(fx(last.completed))} hoàn tất bước ${steps[steps.length - 1].code}
      — mất ${nf(fx(lostAll))} người (${pv(lostAll, base)}%). Riêng bước ${worst.code} ${esc(worst.name)} chiếm ${pv(obs(worst.id).failed, lostAll)}% tổng số rơi.
      <div class="t-meta" style="font-size:12px;margin-top:7px">Bề dày dải xám = số khách còn đi tiếp so với bước đầu · vạch đỏ gạch chéo = phần rơi ra tại bước bên trái · thanh mảnh trong mỗi thẻ = evidence coverage. Trên màn hẹp dưới ~1400px, chuỗi bước cuộn ngang trong khung này.
      Nhãn trạng thái suy ra từ ngưỡng đang đặt ở <a href="#/rules">Chỉ số &amp; ngưỡng</a> (thất bại ≥ ${CFG.step.failWatch}% cần theo dõi, ≥ ${CFG.step.failCrit}% cần xử lý).</div>
    </div>`;
}

/* Hồ sơ một bước. Ba tab thay cho một cột dọc dài — mỗi tab trả lời đúng một
   câu hỏi. Không còn khối "ảnh hưởng nếu thay đổi bước này". */
function stepInspector(sid) {
  const s = step(sid), o = obs(sid), st = stepState(o);
  const tab = ST.sub.atlasTab || 'sig';
  const TABS = [['sig', 'Touchpoint & signal'], ['met', 'Chỉ số liên kết'], ['cov', 'Độ phủ dữ liệu']];
  const tps = DATA.touchpoints.filter((t) => t.stepId === sid);
  const sgs = DATA.signals.filter((g) => tps.some((t) => t.id === g.tpId));
  const SG = { live:['ok','Đang đo'], validating:['watch','Đang validate'], designed:['watch','Đã có spec, chưa implement'], gap:['unknown','Chưa đo (gap)'] };
  const mIds = [...new Set(sgs.flatMap((g) => g.metrics))];
  const gaps = sgs.filter((g) => g.st === 'gap' || g.st === 'designed');
  const relIss = DATA.iss.filter((i) => i.step === sid);

  return `<div class="card" data-tour="atlas-inspector">
    ${chead('Bước ' + s.code + ' · ' + s.name, esc(s.stationId) + ' · phụ trách ' + esc(s.owner), sgs.length, DATA.signals.length, 'signal',
      `<div class="denom">${badge(st)}<br>${period().range}</div>`)}
    <div class="cbody" style="padding-bottom:6px">
      <div class="grid g4">
        ${stat('Vào bước', nf(fx(o.entered)), '', '')}
        ${stat('Hoàn tất', nf(fx(o.completed)), pv(o.completed, o.entered) + '%', '')}
        ${stat('Thất bại', nf(fx(o.failed)), pv(o.failed, o.entered) + '% người vào bước', '', st === 'crit' ? 'var(--crit)' : undefined)}
        ${stat('Evidence coverage', o.cov + '%', o.cov < CFG.step.covMin ? `Dưới ngưỡng ${CFG.step.covMin}%` : `Đạt ngưỡng ${CFG.step.covMin}%`, '', o.cov < CFG.step.covMin ? 'var(--watch)' : undefined)}
      </div>
      <div class="note ${st === 'crit' ? 'crit' : st === 'watch' ? 'warn' : ''}" style="margin-top:13px">
        <b>Vì sao gắn nhãn “${ST_LABEL[st]}”:</b> ${esc(stepWhy(o))}.
        ${relIss.length ? ` Đang có ${relIss.length} điểm gãy mở tại bước này: ${relIss.map((i) => `<a href="#/issue/${i.id}" class="mono">${i.id}</a>`).join(' · ')}.` : ''}
      </div>
    </div>
    <div class="tabs">${TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="setSub('atlasTab','${k}')">${l}</button>`).join('')}</div>
    <div class="cbody">${
      tab === 'sig' ? `
        <div class="t-lbl" style="margin-bottom:8px">Touchpoint (${tps.length})</div>
        ${tps.map((t) => `<div class="note" style="margin-bottom:9px">
          <div style="display:flex;align-items:center;gap:8px"><b style="font-size:13.5px;color:var(--ink)">${esc(t.name)}</b><span class="chip">${esc(t.channel)}</span>
          <div class="grow"></div><span class="t-meta">${nf(fx(t.users))} khách / kỳ</span></div>
          <div style="margin-top:5px">${esc(t.desc)} · phụ trách ${esc(t.owner)}</div></div>`).join('')}
        <div class="t-lbl" style="margin:15px 0 8px">Signal đang gắn vào bước này</div>
        <table><thead><tr><th>Event</th><th>Nguồn</th><th>Platform</th><th>Volume/ngày</th><th>Lần thấy cuối</th><th>Trạng thái</th></tr></thead>
        <tbody>${sgs.map((g) => `<tr>
          <td><code class="mono" style="font-size:12px;color:var(--primary)">${esc(g.name)}</code><div class="t-meta" style="font-size:12px;margin-top:3px">${esc(g.desc)}</div></td>
          <td class="t-meta">${g.es === 'server' ? 'server' : 'client'}</td>
          <td class="t-meta">${g.pf.join(', ')}</td>
          <td><b class="num">${g.vol ? nf(g.vol) : '—'}</b></td>
          <td class="t-meta">${g.seen || '<span style="color:var(--ink3)">chưa từng</span>'}</td>
          <td>${badge(SG[g.st][0], SG[g.st][1])}</td>
        </tr>`).join('')}</tbody></table>`
      : tab === 'met' ? `
        <div class="t-meta" style="margin-bottom:11px">Ngưỡng của từng chỉ số đặt ở màn <a href="#/rules">Chỉ số &amp; ngưỡng</a> — bảng dưới đọc trực tiếp từ đó.</div>
        <div style="display:grid;gap:9px">${mIds.map((mid) => { const m = metric(mid), c = CFG.metric[mid], d = mdir(m); return `
          <div class="note"><div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
            <b style="font-size:13.5px;color:var(--ink)">${esc(m.name)}</b>${metricBadge(m)}
            <div class="grow"></div><b class="num">${esc(m.value)}</b><span class="t-meta">mục tiêu ${esc(m.target)}</span></div>
            <div style="margin-top:7px;font-size:12px">${c && c.on
              ? `Ngưỡng đang áp: cần theo dõi khi ${d === 'down' ? 'vượt' : 'dưới'} <b>${String(c.watch).replace('.', ',')}</b>, cần xử lý khi ${d === 'down' ? 'vượt' : 'dưới'} <b>${String(c.crit).replace('.', ',')}</b>`
              : 'Chỉ số này đang <b>không được theo dõi</b> — vẫn tính và hiện số, nhưng không gắn nhãn trạng thái và không vào cảnh báo.'}</div>
            <div style="margin-top:5px;font-size:12px;color:var(--ink3)">Grain ${esc(m.grain)} · ${esc(m.formula)} · ${esc(m.freshness)} · ${esc(m.owner)}</div>
          </div>`; }).join('')}</div>`
      : `
        <div class="grid g2" style="margin-bottom:14px">
          ${stat('Evidence coverage', o.cov + '%', `Ngưỡng tối thiểu ${CFG.step.covMin}%`, 'Mobile SDK event registry', o.cov < CFG.step.covMin ? 'var(--watch)' : undefined)}
          ${stat('Signal chưa hoạt động', String(gaps.length), gaps.length ? 'Chưa instrument hoặc chỉ có spec' : 'Đủ signal', '')}
        </div>
        ${o.cov < CFG.step.covMin
          ? `<div class="note warn"><b>Còn ${100 - o.cov}% trường hợp thất bại chưa biết lý do.</b> Thấy được số người rớt, nhưng không đọc được nguyên nhân cho phần lớn trong đó — nên mọi giả thuyết về bước này còn yếu bằng chứng.</div>`
          : `<div class="note"><b>Độ phủ đạt ngưỡng.</b> Phần lớn trường hợp thất bại ở bước này có reason code đọc được.</div>`}
        ${gaps.length ? `
          <div class="t-lbl" style="margin:15px 0 8px">Signal đang thiếu</div>
          <div class="lst" style="border:1px solid var(--line);border-radius:10px">${gaps.map((g) => `
            <div style="padding:12px 14px">
              <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
                ${badge(SG[g.st][0], SG[g.st][1])}
                <code class="mono" style="font-size:12px;color:var(--primary)">${esc(g.name)}</code>
                <div class="grow"></div><span class="t-meta">${g.pf.join(', ')}</span>
              </div>
              <div class="t-meta" style="margin-top:6px">${esc(g.desc)}</div>
            </div>`).join('')}</div>` : ''}
        <div class="note" style="margin-top:13px;font-size:12px">Độ phủ dữ liệu là thuộc tính của <b>bước</b>, không phải một màn riêng — nên nó sống ở đây, cạnh chính bước đang xét.</div>`
    }</div>
  </div>`;
}

/* ---------- Nguồn tín hiệu ---------- */
/* Hàng thẻ lọc dùng chung cho 3 màn nền dữ liệu — bấm một thẻ là bảng bên dưới
   thu lại đúng nhóm đó. Đọc trạng thái trước, xem chi tiết sau. */
const fchipRow = (items, cur, key) => `<div class="fchips" style="margin-bottom:14px">${items.map(([k, l, c, n]) => `
  <button class="${cur === k ? 'on' : ''}" onclick="setSel('${key}','${k}')">${c ? `<i style="background:${c}"></i>` : ''}${l}${n != null ? ` <b class="mono">${n}</b>` : ''}</button>`).join('')}</div>`;

/* Ma trận nguồn × nền tảng. Ký hiệu trước, màu sau — đọc được cả khi in đen trắng.
   `compact` = bản rút gọn nhúng vào widget trên Tổng quan. */
const SRC_MARK = { ok:['●','ok'], stale:['◐','stale'], down:['✕','down'] };
function srcMatrix(compact) {
  const PFS = ['ios','android','web','server'];
  /* Cột Trạng thái là BẮT BUỘC, không phải trang trí. Hai nguồn không gắn nền
     tảng nào (nhập tay, webhook) sẽ hiện toàn dấu "–" trên bốn cột nền tảng —
     mà một trong hai chính là Zalo OA đang NGỪNG GỬI. Không có cột này thì nguồn
     hỏng nặng nhất lại là nguồn vô hình nhất. */
  return `<table class="srcmx">
    <thead><tr><th>Nguồn</th>${PFS.map((p) => `<th>${PF_LABEL[p]}</th>`).join('')}<th>Trạng thái</th>${compact ? '' : '<th style="text-align:left">Nguồn này sai thì metric nào sai</th>'}</tr></thead>
    <tbody>${DATA.sources.map((s) => {
      const h = sourceHealth(s), mk = SRC_MARK[h];
      return `<tr>
        <td><b style="font-size:12.5px">${esc(compact ? s.name.replace(/ \(.*\)/, '') : s.name)}</b>${compact ? '' :
          `<div class="t-meta" style="font-size:11.5px;margin-top:2px">${esc(s.note)}</div>`}</td>
        ${PFS.map((p) => s.pf.indexOf(p) > -1
          ? `<td><span class="mk ${mk[1]}" title="${esc(s.name)} · ${PF_LABEL[p]} — ${esc(SRC_LABEL[h])}">${mk[0]}</span></td>`
          : `<td><span class="mk na" title="${s.pf.length ? 'Nguồn này không phủ ' + PF_LABEL[p] : 'Nguồn không gắn nền tảng nào'}">–</span></td>`).join('')}
        <td style="white-space:nowrap"><span class="mk ${mk[1]}">${mk[0]}</span>
          <span style="font-size:11.5px;color:${h === 'ok' ? 'var(--ink3)' : h === 'stale' ? 'var(--watch)' : 'var(--crit)'}">${esc(SRC_LABEL[h])}</span></td>
        ${compact ? '' : `<td style="text-align:left">${s.metrics.length
          ? s.metrics.map((m) => `<span class="chip" style="${h !== 'ok' ? 'color:var(--crit);border-color:currentColor' : ''}">${esc(metric(m).name)}</span>`).join(' ')
          : '<span class="t-meta">không nối metric nào</span>'}</td>`}
      </tr>`;
    }).join('')}</tbody>
  </table>
  <div class="lgd" style="margin-top:9px">
    <span><b class="mk ok">●</b> đang nhận</span><span><b class="mk stale">◐</b> trễ hơn SLA</span>
    <span><b class="mk down">✕</b> ngừng gửi</span><span><b class="mk na">–</b> không áp dụng</span>
  </div>
  ${DATA.sources.some((s) => !s.pf.length) ? `<div class="t-meta" style="font-size:11.5px;margin-top:6px">Nguồn không gắn nền tảng nào: ${DATA.sources.filter((s) => !s.pf.length).map((s) => esc(s.name)).join(' · ')} — nhập tay hoặc qua webhook.</div>` : ''}`;
}
const SRC_LABEL = { ok:'Đang nhận', stale:'Trễ hơn SLA', down:'Ngừng gửi' };

/* ---------- Hồ sơ dữ liệu của MỘT nguồn ----------
   Thay cho màn Feed đã bỏ. Feed cho cuộn từng feedback một — việc đó không dẫn
   tới quyết định nào. Cái cần biết là: nguồn này ra sao, và feedback trong nó
   trông thế nào VỀ MẶT DATA. Vài bản ghi mẫu ở cuối chỉ để biết nguồn này "nói
   kiểu gì", không phải để đọc hết. */
function srcProfile(id) {
  const s = src(id); if (!s) return '';
  const h = sourceHealth(s), mk = SRC_MARK[h];
  const evs = DATA.ev.filter((e) => e.src === id);
  const share = pv(s.vol, scopeTotal());
  const dist = (label, rows, click) => `<div>
    <div class="t-lbl" style="margin-bottom:8px">${esc(label)}</div>
    ${rows.length ? rankBars(rows, { click }) : '<div class="t-meta" style="font-size:12px">Không có bằng chứng mẫu nào từ nguồn này.</div>'}
  </div>`;
  const cnt = (fn) => { const m = {}; evs.forEach((e) => { const k = fn(e); if (k) m[k] = (m[k] || 0) + 1; }); return m; };
  const toRows = (m, name, color) => Object.entries(m).map((kv) => ({ id:kv[0], l:name(kv[0]), v:kv[1], c:color ? color(kv[0]) : undefined }))
    .sort((a, b) => b.v - a.v);
  const themeRows = toRows(cnt((e) => (e.tax.map((t) => tax(t)).find((t) => t && t.lv === 'theme') || {}).id), (k) => tax(k).name);
  const l1Rows    = toRows(cnt((e) => (e.tax.map((t) => tax(t)).find((t) => t && t.lv === 'L1') || {}).id), (k) => tax(k).name);
  const catRows   = toRows(cnt((e) => e.cat), (k) => DATA.cats[k].label, (k) => DATA.cats[k].color);
  const senRows   = toRows(cnt((e) => SEN_BUCKET(e.sen)), (k) => SEN_LABEL[k], (k) => SEN_COLOR[k]);
  const pfRows    = toRows(cnt((e) => e.pf), (k) => PF_LABEL[k] || k);

  return `<div class="card" data-tour="src-profile" style="margin-top:16px;border-color:var(--primary)">
    ${chead('Hồ sơ dữ liệu · ' + s.name, esc(s.note), evs.length, DATA.ev.length, 'bằng chứng mẫu',
      `<div class="denom"><span class="mk ${mk[1]}">${mk[0]}</span> ${esc(SRC_LABEL[h])}<br>
       <button class="disc" onclick="setSel('srcOpen',null)">đóng hồ sơ</button></div>`)}
    <div class="cbody">
      <div class="stats" style="margin:0 0 16px">
        ${stat('Volume trong kỳ', nf(fx(s.vol)), share + '% tổng bản ghi phản hồi', 'Loại nguồn: ' + s.kind)}
        ${stat('Độ tươi', freshLabel(s.lagH), 'SLA riêng của nguồn này: ' + CFG.source[s.id] + ' giờ',
          'Nhận lần cuối ' + s.last, h === 'ok' ? null : h === 'stale' ? 'var(--watch)' : 'var(--crit)')}
        ${stat('Nền tảng phủ', s.pf.length ? String(s.pf.length) + '/4' : '—',
          s.pf.length ? s.pf.map((p) => PF_LABEL[p]).join(' · ') : 'không gắn nền tảng — nhập tay hoặc webhook',
          'Nền tảng thiếu là chỗ có khách nhưng ta không nghe được')}
        ${stat('Chỉ số phụ thuộc', String(s.metrics.length), s.metrics.length ? 'sai nếu nguồn này hỏng' : 'không nối chỉ số nào',
          s.metrics.map((m) => metric(m).name).join(' · ') || '—', s.metrics.length && h !== 'ok' ? 'var(--crit)' : null)}
      </div>

      ${h !== 'ok' ? `<div class="note crit" style="margin-bottom:16px"><b>Nguồn này đang ${esc(SRC_LABEL[h]).toLowerCase()}.</b>
        ${s.metrics.length ? `Mọi con số của ${s.metrics.map((m) => '<b>' + esc(metric(m).name) + '</b>').join(' và ')} trong kỳ này đều thấp hơn thực tế. Đừng dùng để ra quyết định trước khi backfill.`
        : 'Nguồn chưa nối vào chỉ số nào nên không làm sai số liệu, nhưng đang mất tiếng nói của khách.'}</div>` : ''}

      <div class="t-lbl" style="margin-bottom:9px">Feedback trong nguồn này trông thế nào về mặt data</div>
      <div class="grid g3" style="margin-bottom:14px">
        ${dist('Theo intent', catRows, (r) => `drillTopic('${(taxLv('theme').find((t) => t.cat === r.id) || {}).id || ''}')`)}
        ${dist('Theo sentiment', senRows, null)}
        ${dist('Theo nền tảng', pfRows, null)}
      </div>
      <div class="grid g2">
        ${dist('Theo topic', themeRows, (r) => `drillTopic('${r.id}')`)}
        ${dist('Theo phase hành trình', l1Rows, (r) => `drillVoc('${r.id}')`)}
      </div>
      ${axisLbl('Đếm trên ' + evs.length + ' bằng chứng mẫu của nguồn này — không phải toàn bộ ' + nf(fx(s.vol)) + ' bản ghi')}

      ${evs.length ? `<div class="hr"></div>
        <div class="t-lbl" style="margin-bottom:8px">Nguồn này "nói kiểu gì" — ${Math.min(2, evs.length)} bản ghi mẫu</div>
        ${evs.slice(0, 2).map((e) => `<div class="quote" style="margin-bottom:9px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
            ${catChip(e.cat)}<span class="chip">${PF_LABEL[e.pf] || e.pf}</span>
            <span class="mono" style="font-size:12px;color:var(--ink3)">${esc(e.ref)}</span>
            <div class="grow"></div><span class="t-meta">${esc(e.at)}</span>
          </div>
          <p>“${esc(e.q)}”</p>
          <div class="qm"><span>🔒 ${esc(e.ck)}</span><span class="mono">${taxPathAll(e.tax)}</span></div>
        </div>`).join('')}
        <div class="t-meta" style="font-size:12px">Cố ý chỉ hiện hai mẫu. Việc đọc từng feedback một thuộc về ngữ cảnh — xem trong
          <a href="#/topics">Topic</a>, tab Verbatim của <a href="#/vocjourney">VoC theo hành trình</a>, hoặc hồ sơ điểm gãy.</div>` : ''}
    </div>
  </div>`;
}

/* ---------- Nguồn & độ toàn vẹn ----------
   Gộp Nguồn tín hiệu và Khảo sát. Lý do gộp: khảo sát cũng là một nguồn phản hồi,
   chỉ khác ở chỗ ta tự tạo ra nó thay vì chờ khách nói. Đặt cạnh nhau mới thấy
   tỷ lệ nghe thụ động so với hỏi chủ động. */
V.sources = () => {
  const bad = DATA.sources.filter((s) => sourceHealth(s) !== 'ok');
  const hurt = [...new Set(bad.flatMap((s) => s.metrics))];
  const H = { ok:['ok','Đang nhận'], stale:['watch','Trễ hơn SLA'], down:['crit','Ngừng gửi'] };
  const tab = ST.sub.srcTab || 'health';
  const gaps = DATA.signals.filter((g) => g.st === 'gap' || g.st === 'designed');
  const passive = DATA.sources.filter((s) => s.kind !== 'survey').reduce((a, s) => a + s.vol, 0);
  const active = DATA.sources.filter((s) => s.kind === 'survey').reduce((a, s) => a + s.vol, 0);
  const run = DATA.surveys.filter((s) => s.status === 'running').length;
  const off = DATA.surveys.filter((s) => s.state === 'watch' || s.state === 'crit').length;

  return `<div class="wrap">
    <h1 class="t-hero" style="max-width:36ch;margin-bottom:8px">${bad.length} trong ${DATA.sources.length} nguồn đang có vấn đề, và điều đó làm sai ${hurt.length} chỉ số.</h1>
    <p class="t-meta" style="max-width:88ch;margin:0 0 16px">Ba chỉ số toàn vẹn bên dưới bắt ba kiểu hỏng khác nhau: dữ liệu <b>về muộn</b>, có điểm chạm <b>không nguồn nào chạm tới</b>, và nguồn <b>đứt giữa chừng</b> làm số tụt giả tạo. SLA riêng từng nguồn đặt ở <a href="#/rules">Chỉ số &amp; ngưỡng</a>.</p>

    <div class="stats">
      ${stat('Độ tươi', `${DATA.sources.length - bad.filter((s) => sourceHealth(s) === 'stale').length}/${DATA.sources.length}`,
        'Nguồn đang trong SLA độ trễ', 'So lagH với CFG.source riêng từng nguồn',
        bad.some((s) => sourceHealth(s) === 'stale') ? 'var(--watch)' : null)}
      ${stat('Độ phủ', `${DATA.signals.length - gaps.length}/${DATA.signals.length}`,
        `${gaps.length} signal chưa instrument hoặc mới có spec`, 'signals[].st = gap | designed',
        gaps.length ? 'var(--watch)' : null)}
      ${stat('Tính liên tục', `${DATA.sources.length - bad.filter((s) => sourceHealth(s) === 'down').length}/${DATA.sources.length}`,
        'Nguồn không bị đứt', 'volume = 0 nhiều ngày liên tiếp',
        bad.some((s) => sourceHealth(s) === 'down') ? 'var(--crit)' : null)}
      ${stat('Thụ động vs chủ động', `${Math.round(passive / (active || 1))}×`,
        `${nf(fx(passive))} tín hiệu nghe được / ${nf(fx(active))} mẫu hỏi chủ động`,
        'Khảo sát là nguồn duy nhất ta tự tạo ra')}
    </div>

    <div class="tabs" style="margin-bottom:0">
      <button class="${tab==='health'?'on':''}" onclick="setSub('srcTab','health')">Sức khỏe nguồn</button>
      <button class="${tab==='matrix'?'on':''}" onclick="setSub('srcTab','matrix')">Nguồn × nền tảng</button>
      <button class="${tab==='active'?'on':''}" onclick="setSub('srcTab','active')">Nguồn chủ động · ${run}/${DATA.surveys.length} khảo sát đang chạy</button>
    </div>

    ${tab === 'matrix' ? `<div class="card">
      ${chead('Độ toàn vẹn theo nền tảng', 'Một nguồn có thể khỏe trên nền tảng này và chết trên nền tảng khác', DATA.sources.length, DATA.sources.length, 'nguồn')}
      <div class="cbody">${srcMatrix(false)}</div>
    </div>` : ''}

    ${tab === 'health' ? `<div class="card">
      ${chead('Sức khỏe từng nguồn', 'Nguồn có vấn đề xếp lên đầu', DATA.sources.length, DATA.sources.length, 'nguồn')}
      <table data-tour="src-table"><thead><tr><th>Nguồn</th><th>Loại</th><th>Nền tảng</th><th>Volume kỳ</th><th>Độ trễ / SLA</th><th>Nhận lần cuối</th><th>Trạng thái</th><th>Nguồn này sai thì metric nào sai</th></tr></thead>
      <tbody>${DATA.sources.slice().sort((a, b) => (sourceHealth(a) === 'ok' ? 1 : 0) - (sourceHealth(b) === 'ok' ? 1 : 0)).map((s) => {
        const h = sourceHealth(s); return `<tr class="clickable" onclick="drillSource('${s.id}')">
        <td><b style="font-size:13.5px">${esc(s.name)}</b><div class="t-meta" style="font-size:12px;margin-top:3px">${esc(s.note)}</div></td>
        <td class="t-meta">${esc(s.kind)}</td>
        <td class="t-meta">${s.pf.length ? s.pf.map((p) => PF_LABEL[p]).join(' · ') : '<span style="color:var(--ink3)">không gắn nền tảng</span>'}</td>
        <td><b class="num">${s.vol ? nf(fx(s.vol)) : '0'}</b></td>
        <td class="t-meta"><b style="color:${h==='ok'?'var(--ink2)':'var(--crit)'}">${esc(freshLabel(s.lagH))}</b><div style="font-size:12px">SLA ${CFG.source[s.id]} giờ</div></td>
        <td class="t-meta">${esc(s.last)}</td>
        <td>${badge(H[h][0], H[h][1])}</td>
        <td>${s.metrics.length ? s.metrics.map((m) => `<div style="margin-bottom:4px"><span class="chip" style="${h!=='ok'?'color:var(--crit);border-color:currentColor':''}">${esc(metric(m).name)}</span></div>`).join('') : '<span class="t-meta">không nối metric nào</span>'}</td>
      </tr>`; }).join('')}</tbody></table>
      <div class="cbody" style="padding-top:0"><div class="t-meta" style="font-size:12px">Bấm một dòng để mở <b>hồ sơ dữ liệu</b> của nguồn đó.</div></div>
    </div>
    ${ST.sel.srcOpen ? srcProfile(ST.sel.srcOpen) : ''}` : ''}

    ${tab === 'active' ? `<div class="card">
      ${chead('Nguồn chủ động — khảo sát', `${run} đang chạy · ${off} chưa đạt mục tiêu. Nội dung lấy nguyên sheet 4 của tracking-plan-cx-mau.xlsx`, DATA.surveys.length, DATA.surveys.length, 'chương trình')}
      <table><thead><tr><th>Khảo sát</th><th>Loại</th><th>Trigger</th><th>Cooldown</th><th>Response rate</th><th>Kết quả / mục tiêu</th><th>Trạng thái</th></tr></thead>
      <tbody>${DATA.surveys.map((s) => `<tr>
        <td><b style="font-size:13.5px">${esc(s.name)}</b>
          <div class="t-meta" style="font-size:12px;margin-top:4px;max-width:38ch">${esc(s.cond)}</div>
          <div class="t-meta" style="font-size:12px;margin-top:3px">Thang đo: ${esc(s.scale)}</div></td>
        <td><span class="chip">${s.type}</span></td>
        <td><code class="mono" style="font-size:12px;color:var(--primary)">${esc(s.trigger)}</code></td>
        <td class="t-meta">${s.cd} ngày</td>
        <td><b class="num">${s.rr}%</b><div class="t-meta" style="font-size:12px">n = ${nf(s.n)}</div></td>
        <td><b class="num" style="font-size:16px">${esc(s.latest)}</b><div class="t-meta" style="font-size:12px">mục tiêu ${esc(s.target)}</div></td>
        <td>${s.status === 'paused' ? badge('unknown', 'Đang tạm dừng') : badge(s.state)}</td>
      </tr>`).join('')}</tbody></table>
      <div class="cbody">
        <div class="note"><b>Quy tắc cooldown toàn cục:</b> mỗi khách chịu tối đa 1 khảo sát trong <b>${CFG.data.cooldown} ngày</b>, và luôn được phép bỏ qua. Đây là ràng buộc trong tracking plan để không làm khách mệt — hệ thống phải tự chặn, không phụ thuộc người vận hành nhớ. Đổi số ngày ở <a href="#/rules">Chỉ số &amp; ngưỡng</a>.</div>
        <div class="note warn" style="margin-top:9px"><b>NPS đang tạm dừng.</b> Vì vậy bảng <i>Cái gì đáng xử lý trước</i> trên Tổng quan xếp theo tác động CES chứ không theo NPS — xếp hạng dựa trên một khảo sát đã dừng thì con số trông có vẻ chính xác nhưng không nói lên điều gì.</div>
      </div>
    </div>` : ''}

    <div class="note crit" style="margin-top:14px">
      <b>Hệ quả cụ thể đang xảy ra:</b> Zalo OA ngừng gửi từ 19/07 nên <b>repeat contact bị đếm thiếu</b>. Con số 24% trên bảng điều hành thấp hơn thực tế. Mọi quyết định dựa vào repeat contact trong kỳ này cần chờ backfill 8 ngày.
    </div>
  </div>`;
};

/* ---------- Khảo sát ---------- */
/* V.surveys ĐÃ BỎ — nội dung chuyển vào tab "Nguồn chủ động" của V.sources.
   Khảo sát là một nguồn phản hồi, chỉ khác ở chỗ ta tự tạo ra nó. Để riêng một
   route thì không bao giờ thấy được tỷ lệ nghe thụ động so với hỏi chủ động. */

/* ---------- Taxonomy ----------
   Vào màn CHỈ thấy tầng đầu: 7 domain + 6 theme. Bấm một node mới hiện con của
   nó ở cột phải. Không bao giờ dồn cả 27 node ra một cột dọc như bản trước. */
const D_DRIFT = { 'new-term':'Thuật ngữ mới chưa gán', duplicate:'Có thể trùng nghĩa', shifting:'Ngữ nghĩa đang lệch' };
const LV_LABEL = { L1:'L1 · domain', L2:'L2 · nhóm flow', L3:'L3 · bước / tính năng',
                   theme:'Theme · trả lời vì sao', subtheme:'Sub-theme · trả lời vì sao' };
const taxKids = (id) => DATA.tax.filter((n) => n.p === id);
const taxUp = (n) => { const out = []; let c = n; while (c) { out.unshift(c); c = c.p ? tax(c.p) : null; } return out; };

function taxNode(n, max, sel) {
  return `<button class="tnode ${n.id === sel ? 'on' : ''}" onclick="setTax('${n.id}')">
    <div class="tr1">
      <span class="chip mono" style="flex:none">${n.lv === 'subtheme' ? 'sub' : n.lv}</span>
      <b>${esc(n.name)}</b>${n.drift ? badge('watch', 'drift') : ''}
      <span class="tn">${nf(n.n)}</span>
    </div>
    <div class="tbar"><i style="width:${Math.max(4, Math.round((n.n / max) * 100))}%"></i></div>
  </button>`;
}

/* ---------- Topic VoC ----------
   Đảo thứ tự ưu tiên so với màn Taxonomy cũ: theme/sub-theme (VÌ SAO) lên
   trước, cấu trúc L1–L3 (CÁI GÌ) xuống sau — vì L1 nay đã khớp 1–1 với phase
   nên nó thuộc về bản đồ hành trình nhiều hơn là thuộc về màn này. */
const DRIFT_FIX = {
  'new-term':  ['Tạo node mới', 'Gán vào node có sẵn', 'Bỏ qua'],
  duplicate:   ['Gộp hai node', 'Giữ tách, làm rõ định nghĩa', 'Bỏ qua'],
  shifting:    ['Tách node mới', 'Viết lại định nghĩa', 'Bỏ qua'],
};
V.topics = () => {
  const drifts = DATA.tax.filter((n) => n.drift);
  const q = (ST.sel.txq || '').trim().toLowerCase();
  const sel = tax(ST.sel.tx) || tax('x-th-device');
  const kids = taxKids(sel.id), path = taxUp(sel);
  const evs = DATA.ev.filter((e) => e.tax.indexOf(sel.id) > -1);
  const l1 = DATA.tax.filter((n) => n.lv === 'L1'), th = DATA.tax.filter((n) => n.lv === 'theme');
  const hits = q ? DATA.tax.filter((n) => n.name.toLowerCase().indexOf(q) > -1) : [];
  const mx = (arr) => Math.max(1, ...arr.map((n) => n.n));
  const thSorted = th.slice().sort((a, b) => b.n - a.n);
  const trend = (t) => (t.pts && t.pts.length > 1 ? t.pts[t.pts.length - 1] - t.pts[0] : 0);

  return `<div class="wrap">
    <h1 class="t-hero" style="max-width:38ch;margin-bottom:8px">${th.length} topic đang mở, ${thSorted.filter((t) => trend(t) > 0 && t.cat !== 'praise').length} đang tăng theo hướng xấu.</h1>
    <p class="t-meta" style="max-width:90ch;margin:0 0 16px">Topic trả lời <b>vì sao</b> khách nói — khác với L1–L3 trả lời <b>về cái gì</b>. Cột xu hướng là 6 kỳ gần nhất. Bấm một dòng để mở bằng chứng và lý do phân loại.</p>

    ${drifts.length ? `<div class="note warn" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b>⚠ ${drifts.length} node cần người quyết định</b>
        ${drifts.map((n) => `<button class="btn sm" onclick="setTax('${n.id}')">${esc(n.name)} · ${D_DRIFT[n.drift]}</button>`).join('')}
      </div>
      <div style="margin-top:7px">Hệ thống phát hiện, con người quyết định. Không có gộp/tách tự động — bấm một node để xem đề xuất và chọn.</div>
    </div>` : ''}

    <div class="card" style="margin-bottom:16px">
      ${chead('Tất cả topic', 'Volume · xu hướng 6 kỳ · intent chủ đạo · điểm chạm tập trung', thSorted.length, thSorted.length, 'topic')}
      <table><thead><tr><th>Topic</th><th>Intent</th><th>Volume</th><th>Xu hướng 6 kỳ</th><th>Thay đổi</th><th>Sub-theme</th><th>Trạng thái</th></tr></thead>
      <tbody>${thSorted.map((t) => {
        const d = trend(t), bad = t.cat !== 'praise' ? d > 0 : d < 0;
        const subs = taxKids(t.id);
        return `<tr class="clickable" onclick="setTax('${t.id}')">
          <td><b style="font-size:13.5px">${esc(t.name)}</b>
            <div class="t-meta" style="font-size:12px;margin-top:3px;max-width:46ch">${esc(t.why)}</div></td>
          <td>${catChip(t.cat)}</td>
          <td><b class="num">${nf(fx(t.n))}</b></td>
          <td>${t.pts ? sparkline(t.pts, bad ? 'var(--crit)' : 'var(--good)') : '<span class="t-meta">—</span>'}</td>
          <td><b class="num" style="color:${bad ? 'var(--crit)' : 'var(--good)'}">${d > 0 ? '+' : ''}${nf(d)}</b></td>
          <td>${subs.length ? subs.map((s) => `<span class="chip">${esc(s.name)}</span>`).join(' ') : '<span class="t-meta">—</span>'}</td>
          <td>${t.drift ? badge('watch', D_DRIFT[t.drift]) : t.demo ? badge('unknown', 'Dữ liệu demo') : badge('ok', 'Ổn định')}</td>
        </tr>`;
      }).join('')}</tbody></table>
    </div>

    <div class="split" style="grid-template-columns:360px minmax(0,1fr)">
      <div class="card" style="align-self:start">
        ${chead('Chọn node', q ? 'Đang lọc theo từ khóa' : 'Vì sao trước, cái gì sau',
          q ? hits.length : l1.length + th.length, DATA.tax.length, 'node')}
        <div class="cbody">
          <input class="srchin" id="txq" type="text" value="${esc(ST.sel.txq || '')}"
                 placeholder="Tìm node theo tên…" oninput="setTaxQ(this.value)" style="margin-bottom:12px">
          ${q ? (hits.length
            ? `<div style="display:grid;gap:2px">${hits.map((n) => taxNode(n, mx(hits), sel.id)).join('')}</div>`
            : `<div class="empty" style="padding:24px">Không có node nào khớp “${esc(ST.sel.txq)}”.</div>`)
          : `<div class="t-lbl" style="margin-bottom:7px">Vì sao · ${th.length} theme</div>
             <div style="display:grid;gap:2px">${thSorted.map((n) => taxNode(n, mx(th), sel.id)).join('')}</div>
             <div class="hr"></div>
             <div class="t-lbl" style="margin-bottom:7px">Cái gì · ${l1.length} L1, khớp 1–1 với phase</div>
             <div style="display:grid;gap:2px">${l1.map((n) => taxNode(n, mx(l1), sel.id)).join('')}</div>`}
        </div>
      </div>

      <div class="card" style="align-self:start">
        ${chead(esc(sel.name), LV_LABEL[sel.lv], evs.length, DATA.ev.length, 'record mẫu gán vào node này',
          `<div class="denom">${nf(sel.n)} record<br>cập nhật ${esc(sel.up)}</div>`)}
        <div class="cbody">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px">
            ${path.map((n, k) => k === path.length - 1
              ? `<span class="chip b">${esc(n.name)}</span>`
              : `<button class="chip" style="cursor:pointer" onclick="setTax('${n.id}')">${esc(n.name)}</button><span class="dim">›</span>`).join('')}
          </div>

          ${sel.maps ? `<div class="t-meta" style="margin-bottom:12px">Gắn với điểm chạm:
            <span class="chip">${esc((phase(sel.maps) || group(sel.maps) || flow(sel.maps) || step(sel.maps) || {}).name || sel.maps)}</span>
            <button class="disc" onclick="drillVoc('${sel.id}')">Mở trong VoC theo hành trình →</button></div>`
          : (sel.lv === 'L2' || sel.lv === 'L3') ? `<div class="note" style="margin-bottom:12px">${badge('unknown')}
            <b>Chưa gắn điểm chạm nào.</b> Node này có dữ liệu nhưng không chiếu được lên bản đồ hành trình — đây là việc cần người quản trị taxonomy xử lý, không phải lỗi.</div>` : ''}

          ${sel.drift ? `<div class="note crit" style="margin-bottom:14px">
            ${badge('watch', D_DRIFT[sel.drift])}
            <div style="margin-top:7px">${esc(sel.driftNote)}</div>
            <div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap">
              ${DRIFT_FIX[sel.drift].map((a, i) => `<button class="btn sm ${i === 0 ? 'pri' : ''}">${esc(a)}</button>`).join('')}
            </div>
            <div class="t-meta" style="font-size:12px;margin-top:7px">Không có gộp/tách tự động. Hệ thống chỉ phát hiện và đề xuất — quyết định thuộc về người quản trị taxonomy, và mọi thay đổi cần audit trail.</div>
          </div>` : ''}

          ${kids.length ? `<div class="t-lbl" style="margin-bottom:8px">${kids.length} node con — bấm để đi sâu thêm một tầng</div>
            <div style="display:grid;gap:2px;margin-bottom:14px">${kids.map((n) => taxNode(n, mx(kids), sel.id)).join('')}</div>`
          : `<div class="note" style="margin-bottom:14px">${badge('unknown')} <b>Node lá</b> — không có tầng con. Đây là mức chi tiết nhất của nhánh này.</div>`}

          <div class="t-lbl" style="margin-bottom:7px">Vì sao node này tồn tại</div>
          <p class="t-body" style="max-width:78ch;margin:0 0 7px;color:var(--ink2)">${esc(sel.why)}</p>
          <div class="t-meta" style="font-size:12px">Cập nhật ${esc(sel.up)} bởi <b>${esc(sel.by)}</b></div>

          <div class="hr"></div>
          <div class="t-lbl" style="margin-bottom:8px">Record đang gán vào node này${evs.length > 3 ? ` — hiện 3 / ${evs.length}` : ''}</div>
          ${evs.length ? `<div style="display:grid;gap:10px">${evs.slice(0, 3).map((e) => `
            <div class="quote">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap">
                ${catChip(e.cat)}<span class="chip">${esc(src(e.src).name)}</span>
                <span class="mono" style="font-size:12px;color:var(--ink3)">${esc(e.ref)}</span>
                <div class="grow"></div><span class="t-meta">${esc(e.at)}</span>
              </div>
              <p>“${esc(e.q)}”</p>
              <div class="qm"><span>🔒 ${esc(e.ck)}</span><span class="mono">${taxPathAll(e.tax)}</span></div>
              <div class="t-meta" style="font-size:12px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px">
                <b>Vì sao gán vậy:</b> ${esc(e.why)}</div>
            </div>`).join('')}</div>`
          : `<div class="note">${badge('unknown')} Chưa có record mẫu nào trong fixture gán trực tiếp vào node này.</div>`}

          ${sel.drift === 'new-term' ? `
            <div class="hr"></div>
            <div class="t-lbl" style="margin-bottom:8px">Sửa phân loại ở mức record — có audit trail</div>
            <div class="note" style="margin-bottom:11px">Đây là 1 trong 34 record dùng cụm “ứng dụng định danh quốc gia” mà chưa gán được tầng L3:</div>
            <div class="quote" style="margin-bottom:12px">
              <p>“${esc(ev('EV-305').q)}”</p>
              <div class="qm"><span>🔒 ${esc(ev('EV-305').ck)}</span><span class="mono">${esc(ev('EV-305').ref)}</span></div>
            </div>
            <dl class="kv" style="grid-template-columns:auto 1fr;margin-bottom:12px">
              <dt>Đang gán</dt><dd class="mono" style="font-size:12px">${taxPathAll(ev('EV-305').tax)}</dd>
              <dt>Thiếu tầng</dt><dd style="color:var(--crit)">L3 — chưa gán bước cụ thể</dd>
            </dl>
            <div style="display:flex;gap:9px;align-items:flex-end;max-width:560px">
              <div style="flex:1;min-width:0">
                <div class="t-lbl" style="margin-bottom:5px">Gán L3 cho record này</div>
                <select class="sel-in" style="width:100%">
                  <option>— chọn node L3 —</option>
                  ${DATA.tax.filter((n) => n.lv === 'L3').map((n) => `<option>${esc(n.name)}</option>`).join('')}
                </select>
              </div>
              <button class="btn pri">Lưu và ghi audit</button>
            </div>

/* Kiểm tra ngưỡng có đặt ngược nhau không. Đây KHÔNG phải lỗi fixture nên
   không dùng banner đỏ toàn app — cảnh báo hiện ngay trong màn cấu hình. */
function cfgIssues() {
  const e = [];
  if (CFG.step.failCrit <= CFG.step.failWatch)
    e.push(`Bước: ngưỡng cần xử lý (${CFG.step.failCrit}%) phải cao hơn ngưỡng cần theo dõi (${CFG.step.failWatch}%).`);
  DATA.metrics.forEach((m) => {
    const c = CFG.metric[m.id];
    if (!c.on) return;
    if (mdir(m) === 'down' && c.crit <= c.watch)
      e.push(`${m.name}: mục tiêu là càng thấp càng tốt, nên ngưỡng cần xử lý (${c.crit}) phải cao hơn ngưỡng cần theo dõi (${c.watch}).`);
    if (mdir(m) === 'up' && c.crit >= c.watch)
      e.push(`${m.name}: mục tiêu là càng cao càng tốt, nên ngưỡng cần xử lý (${c.crit}) phải thấp hơn ngưỡng cần theo dõi (${c.watch}).`);
  });
  return e;
}

/* ==========================================================================
   ===== 4. SHELL, ROUTER, TOUR =====
   ========================================================================== */
function render() {
  /* nav */
  const pend = ACT.filter((a) => a.ap === 'pending').length;
  const alerts = DATA.ag.flatMap((a) => a.f).filter((f) => !SEEN[f.id]).length;
  $('#nav').innerHTML = DATA.nav.map((n) => {
    if (n.g) return `<div class="g">${n.g}</div>`;
    const bdg = n.r === 'actions' && pend ? pend : n.r === 'agents' && alerts ? alerts : null;
    return `<a class="it ${ST.route === n.r ? 'on' : ''}" href="#/${n.r}">
      <span class="ic">${n.ic}</span>${n.l}${bdg ? `<span class="bdg">${bdg}</span>` : ''}</a>`;
  }).join('');

  /* topbar */
  const m = DATA.meta[ST.route] || DATA.meta.dashboard;
  $('#ptitle').innerHTML = `<b>${m[0]}</b><span>${m[1]}</span>`;
  $('#fperiod').innerHTML = DATA.periods.map((p) => `<option value="${p.id}" ${p.id === ST.period ? 'selected' : ''}>${p.label} · ${p.range}</option>`).join('');
  $('#fscope').innerHTML = DATA.scopes.map((s) => `<option value="${s.id}" ${s.id === ST.scope ? 'selected' : ''}>${s.label}</option>`).join('');

  /* tour spotlight — vẽ SAU khi view render xong (rect mới ổn định), xem tourShow() */
  if (ST.tour > 0) requestAnimationFrame(tourShow);
  else { $('#tourmask').classList.remove('on'); $('#tourpop').classList.remove('on'); }

  /* Banner toàn vẹn dữ liệu — hiện trên MỌI màn nếu fixture bị đứt liên kết */
  const errs = validateFixture();
  const banner = errs.length ? `<div class="note crit" style="margin-bottom:16px">
      <b>⚠ ${errs.length} liên kết dữ liệu mẫu đang sai</b> — sửa trong phần DATA của file này rồi refresh.
      <ul style="margin:8px 0 0;padding-left:19px">${errs.slice(0, 12).map((x) => `<li style="margin:3px 0" class="mono" >${esc(x)}</li>`).join('')}</ul>
      ${errs.length > 12 ? `<div style="margin-top:7px">… và ${errs.length - 12} lỗi nữa.</div>` : ''}
    </div>` : '';

  /* view */
  const fn = V[ST.route] || V.dashboard;
  $('#view').innerHTML = banner + fn(ST.arg);
  if (ST.focus) {
    const el = document.getElementById(ST.focus);
    ST.focus = null;
    if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); }
  } else { $('#view').scrollTop = 0; }
}

/* Route cũ giữ redirect để link, bookmark và bản giới thiệu không đứt:
     issues/actions/outcomes → work   (gộp từ trước)
     health   → work chế độ ưu tiên   (funnel bỏ vì trùng journeySpine)
     surveys  → sources tab chủ động  (khảo sát là một loại nguồn)
     taxonomy → topics                (đổi tên) */
const ALIAS = { issues:'work', actions:'work', outcomes:'work',
                health:'work', surveys:'sources', taxonomy:'topics',
                dashboard:'cxm', feed:'sources', board:'cxm' };
function route() {
  const h = (location.hash || '#/cxm').replace(/^#\/?/, '');
  const [r0, ...rest] = h.split('/');
  const r = ALIAS[r0] || r0;
  /* #/voc/<set> và #/cxm/<set> — set chia sẻ được bằng URL */
  if ((r === 'voc' || r === 'cxm') && rest.length) {
    const d = byId(DATA.dash, rest[0]);
    if (d && d.sec === r) ST.sel.set[r] = d.id;
  }
  if (r0 === 'health')  ST.sub.work = 'pri';
  if (r0 === 'surveys') ST.sub.srcTab = 'active';
  ST.route = V[r] ? r : 'cxm';
  ST.arg = rest.join('/');
  render();
}
/* Nếu hash không đổi thì hashchange không fire — phải tự render, nếu không
   những thay đổi state khác (ví dụ bật guided tour) sẽ không hiện ra. */
function go(path) { const h = '#/' + path; if (location.hash === h) render(); else location.hash = h; }
function setPeriod(v) { ST.period = v; render(); }
function setScope(v)  { ST.scope = v; render(); }
function setSub(k, v) { ST.sub[k] = v; render(); }
function setSel(k, v) { ST.sel[k] = v; render(); }
function setTax(id)   { ST.sel.tx = id; render(); }
/* Ô tìm node vẽ lại cả màn mỗi lần gõ, nên phải trả con trỏ về đúng chỗ —
   nếu không thì gõ được một chữ là mất focus. */
function setTaxQ(v)   { ST.sel.txq = v; ST.focus = 'txq'; render(); }
function setAtlas(fid){
  const f = byId(DATA.flows, fid);
  ST.sel.atlas = fid;
  ST.sel.atlasPhase = byId(DATA.groups, f.groupId).phaseId; /* rail luôn khớp flow đang xem */
  const s = DATA.steps.filter((x) => x.flowId === fid);
  ST.sel.atlasStep = s[0] ? s[0].id : null;
  render();
}
/* Chọn phase thì nhảy luôn sang flow đầu tiên của phase đó — nếu không, rail và
   xương sống bên dưới nói về hai chỗ khác nhau. */
function setAtlasPhase(pid){
  const gids = DATA.groups.filter((g) => g.phaseId === pid).map((g) => g.id);
  const f = DATA.flows.filter((x) => gids.indexOf(x.groupId) > -1);
  if (f.length) setAtlas(f[0].id); else { ST.sel.atlasPhase = pid; render(); }
}

/* ---------- Ghi cấu hình ngưỡng ----------
   onchange (không phải oninput) để render lại sau khi người dùng nhập xong,
   nếu không ô nhập mất focus giữa lúc đang gõ. */
function setCfg(path, v, kind){
  const parts = path.split('.');
  let o = CFG;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  const k = parts[parts.length - 1];
  if (kind === 'num') {
    const n = parseFloat(String(v).replace(',', '.').replace(/[^0-9.\-]/g, ''));
    if (isNaN(n)) { render(); return; }   /* nhập rác thì bỏ qua và vẽ lại giá trị cũ */
    o[k] = n;
  } else if (kind === 'bool') { o[k] = !!v; }
  else { o[k] = v; }
  render();
}
function resetCfg(){ CFG = JSON.parse(JSON.stringify(CFG_DEFAULT)); render(); }
function tog(k)       { ST.sel[k] = !ST.sel[k]; render(); }

   phần đó — không nhảy chéo sang phần kia. Feed đã bỏ: xem từng feedback một
   không dẫn tới quyết định nào; cái cần biết là nguồn nào ra sao và trong nguồn
   đó dữ liệu trông thế nào, nên bằng chứng nằm trong ngữ cảnh (topic, điểm chạm,

/* Từ một node taxonomy sang VoC theo hành trình. Node nào có `maps` thì mở đúng
   điểm chạm đó; node không maps thì mở màn ở trạng thái mặc định và nói rõ vì sao. */
function drillVoc(taxId) {
  const n = tax(taxId);
  ST.sel.vocTax = taxId;
  if (n && n.maps) {
    const ph = phase(n.maps) ? n.maps
      : group(n.maps) ? group(n.maps).phaseId
      : flow(n.maps) ? group(flow(n.maps).groupId).phaseId
      : step(n.maps) ? group(flow(step(n.maps).flowId).groupId).phaseId : null;
    if (ph) ST.sel.vocPhase = ph;
    if (flow(n.maps)) ST.sel.vocFlow = n.maps;
    if (step(n.maps)) { ST.sel.vocFlow = step(n.maps).flowId; ST.sel.vocStep = n.maps; }
  }
  go('vocjourney');
}
function setVoc(k, v) { ST.sel['voc' + k] = v; if (k === 'Phase') { ST.sel.vocFlow = null; ST.sel.vocStep = null; } render(); }
function setQ(k, v)   { const q = Object.assign({}, QB_DEF, ST.sel.qb || {}); q[k] = v; ST.sel.qb = q; render(); }

/* ===== Tạo điểm gãy và gán người xử lý =====

   iss.act ↔ act.iss trỏ đúng hai chiều, và pri.total = tổng 6 thành phần. */
const $v = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
const vnDate = (v) => { const p = String(v).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : ''; };
const plusDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('vi-VN'); };

  let n = 0;
  DATA.iss.concat(ACT).forEach((x) => { const v = parseInt(String(x.id).split('-')[1], 10); if (v > n) n = v; });

function createIssue() {
  const title = $v('ni-title').trim();
  if (!title) { ST.sel.mkerr = 'Cần tiêu đề — một câu nói rõ khách đang gặp gì. Không có câu đó thì người đọc sau này phải tự đoán.'; render(); return; }
  const sid = $v('ni-step'), mid = $v('ni-metric'), sev = $v('ni-sev');
  const owner = $v('ni-owner') || UNASSIGNED;
  const due = vnDate($v('ni-due')) || plusDays(14);
  const plain = $v('ni-plain').trim();
  const o = obs(sid) || { failed:0 };
  const num = nextNum(), iid = 'CXI-' + num, aid = 'CXA-' + num;

  /* Điểm ưu tiên: mức nghiêm trọng + số khách rơi tại bước + mức quan trọng của
     bước. Ba thành phần còn lại để 0 vì chưa có dữ liệu — thà để 0 còn hơn đoán.
     total tính bằng tổng, không gõ tay, nên bất biến của validateFixture() giữ. */
  const pri = { sev:{ critical:30, high:22, medium:14 }[sev], aff:Math.min(24, Math.round((o.failed || 0) / 100)),
                jc:14, rep:0, tr:0, reg:0, total:0 };
  pri.total = pri.sev + pri.aff + pri.jc + pri.rep + pri.tr + pri.reg;

  DATA.iss.push({
    id:iid, title, step:sid, metric:mid, ins:null, act:aid, sev, st:'detecting', conf:50, ev:[], cust:[],
    plain: plain || 'Điểm gãy vừa được tạo trong phiên và chưa gán bằng chứng nào từ khách hàng, nên độ tin cậy còn thấp. Cần bổ sung verbatim hoặc khảo sát tại bước này trước khi duyệt thay đổi.',
    hyp:'Chưa có giả thuyết — điểm gãy mới tạo, chưa nối được bằng chứng.',
    dec:'Chưa đủ căn cứ để duyệt thay đổi. Bổ sung bằng chứng tại bước này trước.',
    pri, imp:{ aff:o.failed || 0, rep:0, csat:0, churn:0, hv:0 },
  });
  ACT.push({ id:aid, iss:iid, title:'Xử lý: ' + title, owner, acc:$v('ni-acc') || APPROVERS[0],
             due, ap:'pending', dl:'backlog', iv:'not-started', lc:'blocked', sm:mid });

  ST.sel.mkiss = false; ST.sel.mkerr = null; ST.sel.asok = null;
  ST.sel.mkok = iid;
  ST.sel.mkokLane = owner === UNASSIGNED ? 'Cần gán người' : 'Chờ duyệt';
  render();
}

function saveAssign(aid) {
  const a = action(aid);
  if (!a) { closeAssign(); return; }
  const own = $v('as-owner');
  if (!own) { ST.sel.aserr = 'Chọn một người xử lý. Đây là chỗ duy nhất biến điểm gãy thành việc của ai đó.'; render(); return; }
  a.owner = own;
  const acc = $v('as-acc'); if (acc) a.acc = acc;
  const due = vnDate($v('as-due')); if (due) a.due = due;
  const i = iss(a.iss); if (i && i.st === 'detecting') i.st = 'investigating';
  ST.sel.assign = null; ST.sel.aserr = null; ST.sel.mkok = null;
  ST.sel.asok = aid;
  render();
}

/* Chuỗi trạng thái governed action — giữ nguyên logic gate của prototype cũ */
function advance(id) {
  const a = action(id);
  if (a.ap === 'pending')      { a.ap = 'approved'; }
  else if (a.dl === 'backlog') { a.dl = 'in-progress'; }
  else if (a.dl === 'in-progress') { a.dl = 'released'; a.rel = 'Bản demo · ' + new Date().toLocaleDateString('vi-VN'); a.iv = 'monitoring'; }
  else if (!outc(id)) {
    /* Bước "nhận dữ liệu đánh giá": không được xác nhận kết quả khi chưa có
       dữ liệu quan sát. validateFixture() sẽ báo lỗi nếu bỏ qua bước này. */
    const m = metric(a.sm);
    const base = parseFloat(String(m.value).replace(',', '.')) || 0;
    const goal = parseFloat(String(m.target).replace(/[^0-9,.]/g, '').replace(',', '.')) || base + 6;
    DATA.out.push({
      act:a.id,
      base:{ v:base, u:'%', p:'Trước bản phát hành', n:412 },
      post:{ v:Math.round((goal + 1.4) * 10) / 10, u:'%', p:'24 giờ sau bản phát hành (mô phỏng)', n:240 },
      cohort:'Cohort demo trong phiên', win:'24 giờ · dữ liệu mô phỏng',
      conf:[], verdict:'improved', by:null,
    });
    a.iv = 'monitoring';
  }
  else if (outc(id).verdict === 'inconclusive' && a.iv !== 'validated') {
    /* Không cho xác nhận khi còn confounder — đẩy người dùng sang đúng chỗ đọc
       yếu tố nhiễu thay vì im lặng không làm gì. */
    ST.sub.issue = 'out'; go('issue/' + a.iss); return;
  }
  else if (a.iv !== 'validated') { a.iv = 'validated'; a.lc = 'ready'; }
  else if (a.lc !== 'closed')    { a.lc = 'closed'; const l = loop(a.iss); if (l) { l.done = l.need; l.by = l.by || 'Thu Hà · Head of CX'; } }
  render();
}

/* ---- Guided tour spotlight ----
   tourPrep đặt state để component đích CHẮC CHẮN tồn tại khi render (set mặc
   định, flow pilot, mở hồ sơ nguồn, làn công việc...). tourEnter đổi route rồi
   go() sẽ render — render() lịch tourShow() qua rAF. */
function tourPrep(s) {
  if (s.r === 'cxm') ST.sel.set.cxm = 'b-cxm-exec';
  if (s.r === 'voc') ST.sel.set.voc = 'b-voc-all';
  if (s.r === 'atlas') { ST.sel.atlas = 'f-open-2026'; ST.sel.atlasPhase = null; ST.sel.atlasStep = null; ST.sub.atlasTab = 'sig'; }
  if (s.r === 'sources') { ST.sub.srcTab = 'health'; ST.sel.srcOpen = s.sel.indexOf('src-profile') > -1 ? 'src-zalo' : null; }
  if (s.r === 'work') ST.sub.work = 'lanes';
  if (s.r === 'vocjourney') { ST.sel.vocPhase = 'p2'; ST.sub.vocTab = s.sel.indexOf('voc-inspector') > -1 ? 'verb' : 'topic'; }
}
function tourEnter() { const s = DATA.tour[ST.tour - 1]; tourPrep(s); go(s.r); }
function startTour() { ST.tour = 1; tourEnter(); }
function stopTour()  { ST.tour = 0; $('#tourmask').classList.remove('on'); $('#tourpop').classList.remove('on'); render(); }
function tourGo(d)   { ST.tour = Math.min(DATA.tour.length, Math.max(1, ST.tour + d)); tourEnter(); }

/* Vẽ popover + khoét sáng cho stop hiện tại. Selector không thấy element →
   popover về giữa màn (fallback), tour không vỡ. */
function tourShow() {
  if (ST.tour < 1) return;
  const t = DATA.tour[ST.tour - 1];
  const mask = $('#tourmask'), hole = $('#tourhole'), pop = $('#tourpop');
  pop.innerHTML = `<span class="tn">BƯỚC ${ST.tour}/${DATA.tour.length} · ${esc(t.grp)}</span>
    <b>${esc(t.t)}</b><p>${esc(t.d)}</p>
    <div class="tb">
      ${ST.tour > 1 ? '<button onclick="tourGo(-1)">← Lùi</button>' : ''}
      ${ST.tour < DATA.tour.length ? '<button class="pri" onclick="tourGo(1)">Tiếp →</button>' : '<button class="pri" onclick="stopTour()">Xong</button>'}
      <button class="x" onclick="stopTour()">Thoát</button>
    </div>`;
  mask.classList.add('on'); pop.classList.add('on');
  const el = t.sel && document.querySelector(t.sel);
  if (el) {
    el.scrollIntoView({ block:'center', inline:'nearest' });
    requestAnimationFrame(() => {
      const r = el.getBoundingClientRect(), pad = 8;
      hole.style.display = 'block';
      hole.style.left = (r.left - pad) + 'px'; hole.style.top = (r.top - pad) + 'px';
      hole.style.width = (r.width + pad * 2) + 'px'; hole.style.height = (r.height + pad * 2) + 'px';
      placePop(pop, r);
    });
  } else {
    hole.style.display = 'none';
    pop.style.transform = 'translate(-50%,-50%)';
    pop.style.left = '50%'; pop.style.top = '50%';
  }
}
/* Đặt popover: dưới element nếu đủ chỗ → trên → giữa; kẹp ngang trong viewport. */
function placePop(pop, r) {
  pop.style.transform = 'none';
  const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 14, vw = innerWidth, vh = innerHeight;
  let top;
  if (r.bottom + gap + ph <= vh) top = r.bottom + gap;
  else if (r.top - gap - ph >= 0) top = r.top - gap - ph;
  else top = Math.max(gap, (vh - ph) / 2);
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(gap, Math.min(left, vw - pw - gap));
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
window.addEventListener('resize', () => { if (ST.tour > 0) tourShow(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ST.tour > 0) stopTour(); });

window.addEventListener('hashchange', route);
route();
</script>
